<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert Governance Stress-Test: governance command centre</title>
<style>
  :root {
    --bg:#04070e; --ink:#eef4ff; --ink2:#b4c3da; --mute:#8696af; --dim:#5a6a84;
    --glass:rgba(255,255,255,.035); --glass2:rgba(255,255,255,.065); --edge:rgba(120,190,255,.15); --edge2:rgba(120,210,255,.34);
    --cyan:#35e6ff; --cyanbg:rgba(53,230,255,.12);
    --amber:#ffb13d; --amberbg:rgba(255,177,61,.13);
    --red:#e5484d; --redbg:rgba(229,72,77,.14); --green:#2fbf71; --greenbg:rgba(47,191,113,.14);
    --violet:#a78bfa; --violetbg:rgba(167,139,250,.14);
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; color:var(--ink); background:radial-gradient(1200px 700px at 70% -10%, #0e1d3a 0%, transparent 60%), radial-gradient(900px 600px at -10% 110%, #0a1830 0%, transparent 60%), var(--bg);
         font:15px/1.6 Inter, "SF Pro Text", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height:100vh; }
  h1,h2,h3,h4 { margin:0; line-height:1.2; font-weight:650; letter-spacing:-.01em; }
  a { color:var(--cyan); } code { background:rgba(255,255,255,.07); padding:1px 6px; border-radius:5px; font-size:.86em; color:#cfe3ff; }
  ::selection { background:rgba(53,230,255,.3); }
  :focus-visible { outline:2px solid var(--cyan); outline-offset:2px; border-radius:6px; }

  /* atmosphere */
  #fx { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5; }
  .grid { position:fixed; inset:0; z-index:0; pointer-events:none; background-image:linear-gradient(rgba(120,190,255,.04) 1px,transparent 1px), linear-gradient(90deg,rgba(120,190,255,.04) 1px,transparent 1px); background-size:56px 56px;
          mask-image:radial-gradient(ellipse at 60% 30%, #000 20%, transparent 78%); -webkit-mask-image:radial-gradient(ellipse at 60% 30%, #000 20%, transparent 78%); }
  .scan { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.45; background:repeating-linear-gradient(0deg, rgba(255,255,255,.016) 0 1px, transparent 1px 3px); }
  .scan::after { content:""; position:absolute; left:0; right:0; height:140px; top:-140px; background:linear-gradient(180deg,transparent,rgba(53,230,255,.045),transparent); animation:sweep 9s linear infinite; }
  @keyframes sweep { to { transform:translateY(130vh); } }

  /* shell */
  .shell { position:relative; z-index:1; display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh; }
  .rail { position:sticky; top:0; height:100vh; padding:22px 14px; display:flex; flex-direction:column; gap:6px; border-right:1px solid var(--edge); background:rgba(4,8,16,.66); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .brand { display:flex; align-items:center; gap:11px; padding:2px 8px 18px; } .brand svg { flex:none; }
  .brand b { font-size:12px; letter-spacing:.14em; text-transform:uppercase; line-height:1.25; } .brand small { display:block; color:var(--dim); letter-spacing:.1em; font-size:10px; text-transform:uppercase; }
  .navbtn { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:11px 12px; border:1px solid transparent; border-radius:11px; background:none; color:var(--mute); font:inherit; font-size:14px; cursor:pointer; transition:all .25s var(--ease); }
  .navbtn svg { flex:none; opacity:.8; } .navbtn:hover { color:var(--ink); background:var(--glass); }
  .navbtn.on { color:#fff; background:linear-gradient(90deg,rgba(53,230,255,.16),rgba(53,230,255,.03)); border-color:var(--edge2); }
  .navbtn.on svg { color:var(--cyan); opacity:1; }
  .railfoot { margin-top:auto; display:flex; flex-direction:column; gap:8px; padding-top:14px; border-top:1px solid var(--edge); }
  .railfoot select, .railfoot input { width:100%; padding:7px 10px; border-radius:9px; border:1px solid var(--edge); background:rgba(255,255,255,.05); color:var(--ink); font:inherit; font-size:12px; }
  .railfoot select option { color:#111; } .railfoot input::placeholder { color:var(--dim); }
  .tag { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:11.5px; border:1px solid var(--edge); color:var(--mute); background:var(--glass); width:fit-content; }
  .tag.ok { color:var(--green); border-color:rgba(47,191,113,.4); background:var(--greenbg); } .tag.bad { color:#ff9a9d; border-color:rgba(229,72,77,.5); background:var(--redbg); }
  .dotp { width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 8px currentColor; }
  main { padding:30px clamp(18px,3.4vw,56px) 64px; max-width:1240px; width:100%; margin:0 auto; }
  .page { animation:rise .45s var(--ease) both; }
  @keyframes rise { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:none; } }

  /* glass + type hierarchy: primary (ink) > supporting (ink2/mute) > deep detail (dim, inside drawers) */
  .panel { background:linear-gradient(180deg,var(--glass2),var(--glass)); border:1px solid var(--edge); border-radius:20px; padding:20px 22px; margin-bottom:18px;
           backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); box-shadow:0 10px 40px rgba(0,0,0,.35); overflow-wrap:anywhere; transition:border-color .3s var(--ease); }
  .panel:hover { border-color:var(--edge2); }
  .eyebrow { text-transform:uppercase; letter-spacing:.18em; font-size:11px; color:var(--cyan); font-weight:600; }
  .ptitle { font-size:clamp(26px,3vw,34px); margin:8px 0 6px; letter-spacing:-.02em; }
  .lead { color:var(--ink2); font-size:16px; max-width:720px; margin:0 0 22px; }
  .sec { font-size:11px; text-transform:uppercase; letter-spacing:.18em; color:var(--dim); font-weight:700; margin:32px 0 14px; display:flex; align-items:center; gap:10px; }
  .sec::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--edge),transparent); }
  .mute { color:var(--mute); } small, .small { color:var(--mute); font-size:12.5px; }
  .c2, .c3 { display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; } .c2 { -webkit-line-clamp:2; } .c3 { -webkit-line-clamp:3; }
  .note { border-left:3px solid var(--amber); background:var(--amberbg); padding:10px 14px; border-radius:0 12px 12px 0; font-size:13.5px; color:#ffe2b0; margin-bottom:14px; }
  .note.cyan { border-left-color:var(--cyan); background:var(--cyanbg); color:#bff4fb; }
  .chip { display:inline-block; padding:2px 10px; border-radius:999px; font-size:11.5px; margin:2px 5px 2px 0; background:var(--glass2); color:var(--ink2); border:1px solid var(--edge); }
  .chip.ok { color:var(--cyan); background:var(--cyanbg); border-color:rgba(53,230,255,.3); }
  .chip.part { color:var(--amber); background:var(--amberbg); border-color:rgba(255,177,61,.32); }
  .chip.bad { color:#ff9a9d; background:var(--redbg); border-color:rgba(229,72,77,.35); }
  .chip.green { color:var(--green); background:var(--greenbg); border-color:rgba(47,191,113,.35); }
  .chip.cite { color:#9fd0ff; background:rgba(80,140,255,.1); border-color:rgba(100,160,255,.28); font-family:ui-monospace,Menlo,monospace; font-size:10.5px; cursor:pointer; }
  .chip.cite:hover { background:rgba(80,140,255,.24); color:#fff; }
  .chip.flag { color:var(--violet); background:var(--violetbg); border-color:rgba(167,139,250,.32); cursor:help; }
  .chip.lg { font-size:12.5px; padding:3px 12px; }

  .btn { border:1px solid var(--edge2); background:var(--glass2); color:var(--ink); padding:9px 16px; border-radius:11px; cursor:pointer; font:inherit; font-size:13.5px; transition:all .25s var(--ease); }
  .btn:hover { border-color:var(--cyan); box-shadow:0 0 18px rgba(53,230,255,.2); transform:translateY(-1px); }
  .btn:disabled { opacity:.35; cursor:default; transform:none; box-shadow:none; }
  .btn.primary { background:linear-gradient(90deg,rgba(53,230,255,.28),rgba(53,230,255,.08)); border-color:rgba(53,230,255,.6); color:#fff; font-weight:600; padding:11px 20px; }
  .btn.go { border-color:rgba(47,191,113,.55); color:var(--green); } .btn.no { border-color:rgba(229,72,77,.55); color:#ff9a9d; }
  .btn.sm { padding:6px 12px; font-size:12.5px; }

  /* drawers (everything deep lives here, closed by default) */
  .drawer-d { margin-top:14px; border:1px solid var(--edge); border-radius:13px; background:rgba(2,6,14,.45); }
  .drawer-d > summary { cursor:pointer; list-style:none; padding:10px 14px; color:var(--cyan); font-size:13px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  .drawer-d > summary::-webkit-details-marker { display:none; }
  .drawer-d > summary::after { content:"+"; font-size:17px; color:var(--mute); transition:transform .3s var(--ease); }
  .drawer-d[open] > summary::after { transform:rotate(45deg); }
  .drawer-d .in { padding:2px 16px 16px; color:var(--ink2); }
  .drawer-d .in .sec { margin:18px 0 8px; }
  .kv { display:grid; grid-template-columns:150px minmax(0,1fr); gap:6px 14px; margin-top:12px; font-size:14px; } .kv .k { color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.08em; padding-top:2px; }
  @media (max-width:640px) { .kv { grid-template-columns:1fr; } }
  .human { background:var(--amberbg); border:1px solid rgba(255,177,61,.3); color:#ffe2b0; padding:9px 12px; border-radius:11px; font-size:13.5px; margin:10px 0; } .human b { color:var(--amber); }
  .claim-row { border-left:2px solid var(--edge2); padding:6px 0 6px 12px; margin:10px 0; } .claim-row.ok { border-left-color:var(--cyan); } .claim-row.part { border-left-color:var(--amber); } .claim-row.bad { border-left-color:var(--red); }
  .claim-row .t { font-size:14px; } .struck { text-decoration:line-through; color:var(--dim); }
  pre { background:rgba(0,0,0,.4); padding:10px; border-radius:10px; overflow:auto; font-size:11px; max-height:240px; color:#a9bfdc; border:1px solid var(--edge); }
  .ev-item { background:rgba(255,255,255,.03); border:1px solid var(--edge); border-radius:11px; padding:9px 12px; margin:8px 0; font-size:13.5px; }
  .scroll { overflow-x:auto; }

  /* "What you're looking at" guide strip */
  .guide { margin:0 0 22px; border:1px solid rgba(53,230,255,.28); background:linear-gradient(90deg,rgba(53,230,255,.09),rgba(53,230,255,.02)); border-radius:16px; }
  .guide > summary { cursor:pointer; list-style:none; padding:11px 16px; display:flex; align-items:center; gap:10px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--cyan); font-weight:700; }
  .guide > summary::-webkit-details-marker { display:none; }
  .guide > summary::after { content:"Hide"; margin-left:auto; font-size:11px; letter-spacing:.08em; color:var(--mute); text-transform:none; font-weight:500; }
  .guide:not([open]) > summary::after { content:"Show"; }
  .guide .ico { width:18px; height:18px; border-radius:50%; border:1.5px solid var(--cyan); display:inline-flex; align-items:center; justify-content:center; font-size:11px; letter-spacing:0; }
  .guide .gb { padding:0 18px 16px 44px; }
  .guide .what { font-size:15px; color:var(--ink); margin:0 0 10px; max-width:860px; }
  .guide .how { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
  .guide .how div { font-size:13px; color:var(--ink2); border-left:2px solid var(--edge2); padding-left:10px; }
  .guide .how b { display:block; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-bottom:2px; }
  @media (max-width:640px) { .guide .gb { padding-left:18px; } }

  /* ---------- Mission Control ---------- */
  .hero { display:flex; justify-content:space-between; align-items:flex-end; gap:18px; flex-wrap:wrap; margin-bottom:20px; }
  .hero h1 { font-size:clamp(32px,4.8vw,58px); font-weight:730; letter-spacing:-.028em; margin:10px 0 10px; background:linear-gradient(180deg,#fff 30%,#a9bddb); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero .sub { font-size:clamp(16px,1.7vw,20px); color:var(--ink2); max-width:640px; }
  .simtag { font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:.16em; color:var(--amber); border:1px solid rgba(255,177,61,.45); background:var(--amberbg); padding:6px 12px; border-radius:8px; white-space:nowrap; }
  .stage { position:relative; padding:0; overflow:hidden; border-radius:24px; margin-bottom:20px; }
  .stage svg { display:block; width:100%; height:auto; max-height:54vh; margin:0 auto; }
  .stage .corner { position:absolute; left:18px; top:14px; font-family:ui-monospace,Menlo,monospace; font-size:10px; letter-spacing:.14em; color:var(--amber); text-transform:uppercase; pointer-events:none; }
  .stage .caption { padding:0 20px 14px; font-family:ui-monospace,Menlo,monospace; font-size:10px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase; }
  .map-fill { fill:rgba(53,230,255,.045); stroke:rgba(53,230,255,.55); stroke-width:1.2; stroke-linejoin:round; }
  .map-glow { fill:none; stroke:rgba(53,230,255,.25); stroke-width:6; filter:url(#blur); stroke-linejoin:round; }
  .gl { stroke:rgba(120,190,255,.07); stroke-width:1; }
  .ring { fill:none; stroke:var(--amber); stroke-width:1.4; opacity:0; transform-box:fill-box; transform-origin:center; animation:ping 3.6s var(--ease) infinite; }
  .ring.r2 { animation-delay:1.2s; } .ring.r3 { animation-delay:2.4s; }
  @keyframes ping { 0% { transform:scale(.2); opacity:.9; } 100% { transform:scale(5.5); opacity:0; } }
  .glowspot { fill:url(#alertGlow); animation:breathe 4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes breathe { 50% { opacity:.55; transform:scale(1.15); } }
  .sigline { fill:none; stroke:var(--amber); stroke-width:1.6; stroke-dasharray:6 8; animation:flow 1.6s linear infinite; filter:drop-shadow(0 0 4px rgba(255,177,61,.8)); }
  .flow { fill:none; stroke:var(--cyan); stroke-width:1.3; stroke-dasharray:3 9; opacity:.75; animation:flow 2.4s linear infinite; } .flow.rev { animation-direction:reverse; animation-duration:3s; }
  .flowbase { fill:none; stroke:rgba(53,230,255,.1); stroke-width:1; }
  @keyframes flow { to { stroke-dashoffset:-56; } }
  .node circle.body { fill:rgba(8,16,32,.92); stroke-width:1.5; }
  .node .halo { fill:none; stroke-width:1; opacity:.4; transform-box:fill-box; transform-origin:center; animation:breathe 5s ease-in-out infinite; }
  .node text { font:600 12px Inter, -apple-system, sans-serif; fill:#e6eefc; text-anchor:middle; } .node text.sm { font:500 10px ui-monospace,Menlo,monospace; fill:var(--mute); letter-spacing:.08em; }
  .svgtxt { font:600 11px ui-monospace,Menlo,monospace; letter-spacing:.14em; }

  .flow4 { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; padding:8px; }
  .st { position:relative; padding:14px 16px 14px 20px; }
  .st:not(:last-child)::after { content:""; position:absolute; right:-7px; top:50%; width:13px; height:13px; margin-top:-7px; border-top:2px solid var(--edge2); border-right:2px solid var(--edge2); transform:rotate(45deg); z-index:1; }
  .st .n { font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:.14em; color:var(--dim); }
  .st b { display:block; font-size:15.5px; margin:2px 0; } .st small { display:block; }
  .st .bulb { position:absolute; left:0; top:16px; bottom:16px; width:3px; border-radius:3px; background:var(--edge2); animation:lit 8s linear infinite; }
  .st:nth-child(2) .bulb { animation-delay:2s; } .st:nth-child(3) .bulb { animation-delay:4s; } .st:nth-child(4) .bulb { animation-delay:6s; }
  .st:nth-child(1) .bulb { --c:var(--amber); } .st:nth-child(2) .bulb { --c:var(--cyan); } .st:nth-child(3) .bulb { --c:var(--amber); } .st:nth-child(4) .bulb { --c:var(--cyan); }
  @keyframes lit { 0%,22% { background:var(--c); box-shadow:0 0 14px var(--c); } 28%,100% { background:var(--edge2); box-shadow:none; } }
  @media (max-width:900px) { .flow4 { grid-template-columns:repeat(2,minmax(0,1fr)); } .st:not(:last-child)::after { display:none; } }
  @media (max-width:520px) { .flow4 { grid-template-columns:1fr; } }

  .cards3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-bottom:18px; }
  .status { display:flex; gap:14px; align-items:center; padding:18px 20px; margin:0; }
  .status .ic { width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; flex:none; }
  .status .k { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--mute); font-weight:700; }
  .status .v { font-size:22px; font-weight:680; letter-spacing:-.01em; } .status .d { font-size:13px; color:var(--mute); }
  .status.amber { border-color:rgba(255,177,61,.36); } .status.amber .ic { background:var(--amberbg); color:var(--amber); animation:glowamber 3.2s ease-in-out infinite; } .status.amber .v { color:var(--amber); }
  .status.cyan .ic { background:var(--cyanbg); color:var(--cyan); } .status.cyan .v { color:var(--cyan); }
  .status.plain .ic { background:var(--glass2); color:var(--ink2); }
  @keyframes glowamber { 50% { box-shadow:0 0 18px rgba(255,177,61,.45); } }
  .cta { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin:4px 0 20px; }
  .disc { font-size:12px; color:var(--mute); border:1px solid var(--edge); background:rgba(255,255,255,.025); padding:9px 14px; border-radius:12px; margin-bottom:12px; } .disc b { color:#d4e1f6; font-weight:600; }
  .closing { font-size:14px; color:var(--ink2); border-left:3px solid var(--cyan); padding:2px 0 2px 14px; margin:14px 0 0; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin:6px 0 4px; }
  .stat { border:1px solid var(--edge); border-radius:12px; padding:12px 14px; } .stat .n { font-size:22px; font-weight:700; color:#fff; } .stat .n small { font-size:12px; font-weight:500; } .stat .l { color:var(--mute); font-size:12px; }
  .steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
  .step { border:1px solid var(--edge); border-radius:12px; padding:12px 14px; } .step .no { font-family:ui-monospace,Menlo,monospace; color:var(--cyan); font-size:11px; letter-spacing:.14em; } .step h4 { font-size:14px; margin:3px 0; } .step p { margin:0; color:var(--mute); font-size:12.5px; }

  /* simulated resident phone (HTML/CSS only; no message is ever sent) */
  .phonerow { display:grid; grid-template-columns:auto minmax(0,1fr); gap:28px; align-items:center; padding:24px 28px; }
  .phone { position:relative; width:236px; height:420px; border-radius:36px; border:2px solid var(--edge2); background:linear-gradient(180deg,#0b1730,#050a16); padding:14px 12px; box-shadow:0 20px 50px rgba(0,0,0,.5), 0 0 0 6px rgba(255,255,255,.025); overflow:hidden; flex:none; }
  .phone::before { content:""; position:absolute; left:50%; top:9px; width:70px; height:16px; margin-left:-35px; border-radius:10px; background:#02050c; }
  .phone .sb { margin-top:20px; display:flex; justify-content:space-between; font-family:ui-monospace,Menlo,monospace; font-size:9px; letter-spacing:.12em; color:var(--amber); }
  .phone .sim { margin:12px 0 0; text-align:center; font-family:ui-monospace,Menlo,monospace; font-size:9.5px; letter-spacing:.2em; color:var(--mute); }
  .phone .notif { position:absolute; left:12px; right:12px; top:92px; border-radius:16px; padding:11px 12px; background:rgba(255,255,255,.1); border:1px solid rgba(255,177,61,.55); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:0 0 26px rgba(255,177,61,.25); animation:pop 6s var(--ease) infinite; }
  @keyframes pop { 0% { transform:translateY(-22px); opacity:0; } 8%,88% { transform:none; opacity:1; } 100% { transform:none; opacity:1; } }
  .phone .notif .app { display:flex; justify-content:space-between; align-items:center; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); font-weight:700; }
  .phone .notif h4 { font-size:15px; margin:7px 0 3px; color:#fff; } .phone .notif p { margin:0; font-size:11.5px; color:var(--ink2); line-height:1.4; }
  .phone .utag { display:inline-block; margin-top:8px; font-size:10px; padding:2px 8px; border-radius:999px; background:var(--amberbg); color:var(--amber); border:1px solid rgba(255,177,61,.4); }
  .phone .pbtn { position:absolute; left:12px; right:12px; bottom:20px; text-align:center; }
  .phone .pbtn .btn { width:100%; font-size:12px; padding:9px 10px; }
  .phone .home { position:absolute; left:50%; bottom:7px; width:70px; height:3px; margin-left:-35px; border-radius:3px; background:rgba(255,255,255,.3); }
  .phonecap h3 { font-size:clamp(18px,2vw,22px); margin-bottom:8px; } .phonecap p { margin:0 0 8px; color:var(--ink2); }
  .phonecap .pts { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
  @media (max-width:700px) { .phonerow { grid-template-columns:1fr; justify-items:center; text-align:left; padding:22px 16px; } }
  @media (prefers-reduced-motion: reduce) { .phone .notif { animation:none !important; } }

  /* guided-story additions */

const FLAG_LABEL = { NO_MANDATE_FOUND:"No published authority located", PUBLIC_DOCUMENTATION_LIMITATION:"Source limitation", AMBIGUOUS_PROVISION:"Provision unclear",
  CONFLICT_DETECTED:"Provisions conflict", COORDINATION_REQUIRED:"Coordination needed", UNSUPPORTED:"Claim rewritten" };
const ACTION_LABEL = { request_information:"Request information", convene_coordination:"Convene coordination", report_network_status:"Report network status",

async function api(path, opts) {
  if (EXPORT) {
    if (path === "/api/runs") return EXPORT.runs;
    if (path.startsWith("/api/run/")) return EXPORT.run;
    if (path === "/api/report") return EXPORT.report;

function md(src){  // small markdown renderer (headings, quotes, lists, tables, bold, code, links)

  const close = () => { while (list > 0) { out += "</ul>"; list--; } };
  const flushT = () => { if (!tbl.length) return; const rows = tbl.filter(r => !/^\|[\s:|-]+\|$/.test(r)).map(r => r.split("|").slice(1,-1).map(c => c.trim()));
      out += '<div class="scroll"><table>' + rows.map((r,i) => "<tr>" + r.map(c => (i?"<td>":"<th>") + inl(c) + (i?"</td>":"</th>")).join("") + "</tr>").join("") + "</table></div>"; tbl = []; };
  for (const raw of lines) {
    const l = raw.replace(/\s+$/,"");
    if (/^\|.*\|$/.test(l)) { close(); tbl.push(l); continue; } else flushT();

    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { close(); out += `<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`; }

    else if ((m = l.match(/^(\s*)[-*]\s+(.*)$/))) { const depth = Math.floor(m[1].length/2)+1; while (list < depth) { out += "<ul>"; list++; } while (list > depth) { out += "</ul>"; list--; } out += `<li>${inl(m[2])}</li>`; }
    else if (/^---+$/.test(l)) { close(); out += "<hr>"; }

  }

}

function apprState(r, run){ const a = run.approvals[r.hash]; return !r.human_approval.required ? "none" : a ? a.decision : "pending"; }
function apprChip(r, run){ const a = run.approvals[r.hash], s = apprState(r, run);
  return s==="none" ? `<span class="chip">No review needed</span>` : s==="pending" ? `<span class="chip part">Needs review</span>` : `<span class="chip ${s==="approved"?"green":"bad"}">${cap(s)} by ${esc(a.by)}</span>`; }

/* ---------- scorecard parsing (numbers come from report/scorecard.md, not retyped) ---------- */
function parseScore(){
  const rows = []; let inTable = false, seenHeader = false;
  for (const l of String(S.report.scorecard).split("\n")) {
    if (/^\|/.test(l)) { if (/^\|[\s:|-]+\|$/.test(l)) { inTable = true; continue; } if (!seenHeader) { seenHeader = true; continue; } if (inTable) rows.push(l.split("|").slice(1,-1).map(c=>c.trim())); }
    else if (inTable) break;
  }
  return rows.map(r => { const f = c => { const m = (c||"").match(/(\d+)\s*\/\s*(\d+)/); return m ? { a:+m[1], b:+m[2] } : null; }; return { metric:r[0], base:r[1], grd:r[2], bf:f(r[1]), gf:f(r[2]) }; });
}
const scoreFind = (rows, re) => rows.find(r => re.test(r.metric));
const leadInt = c => { const m = String(c||"").match(/^\s*(\d+)/); return m ? +m[1] : null; };

/* ---------- Evidence-supported findings ---------- */
function gapTitle(t){ return { decision_owner_unclear:"No event-specific decision owner identified", correction_procedure_not_established:"No correction or cancellation procedure established",
  interface_unclear:"Interface between bodies unclear", ambiguous_provision:"Provision can be read more than one way", mandate_not_established:"Mandate not established" }[t] || cap(human(t)); }

function gapCard(g, n, soft){
  const unofficial = (g.evidence||[]).some(e => String(e.chunk_id).includes("unofficial"));
  const sev = (g.severity||{}).level || "";
  const ev = (g.evidence||[]).map(e => `<div class="ev-item">${citeChip(e.chunk_id)}<div style="margin-top:4px">${esc(e.why)}</div></div>`).join("");
  const gc = g.global_comparison ? `<div class="sec">Global comparison</div><div class="ev-item">${citeChip(g.global_comparison.chunk_id)}<div style="margin-top:4px">${esc(g.global_comparison.why || g.global_comparison.summary || "")}</div></div>` : "";
  const inner = `<p><small>${soft ? "Observation" : "Finding"} ${n} · listed as <code>${esc(g.gap_id)}</code> in the report · type <code>${esc(g.type)}</code></small></p>
    <div class="kv"><div class="k">Affected roles</div><div>${(g.affected_institutions||[]).map(a=>`<span class="chip">${esc(human(a))}</span>`).join("")}</div>
      <div class="k">Direction (domain level)</div><div>${esc(g.direction||"")}</div></div>
    <div class="sec">What the sources give, and what they do not</div>${ev}${gc}
    <div class="sec">Verification note and traceability</div><p class="mute">${esc(g.verifier_notes||"")}</p><small>Traceable to ${(g.source_records||[]).length} audit records.</small>`;
  return `<div class="panel gap ${soft?"obs":sev}">
    <div>${soft ? `<span class="chip">Lower-confidence observation</span>` : `<span class="chip sev-${esc(sev)} lg">${cap(esc(sev))} severity</span>`}

    <h3>${esc(gapTitle(g.type))}</h3>

    <div class="lbl">What the documents do not say</div><div class="txt c3">${esc(g.description)}</div>
    ${drawerBox("View evidence", inner)}</div>`;
}

function renderGaps(){

  const lims = ga.documentation_limitations || [];
  const seen = new Set(), uniq = lims.filter(l => { const k = (l.why||l).slice(0,90); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0,8);
  const inner = `<div class="note">Gaps describe what the <b>published documents</b> establish, not how any institution behaves. Each depends on a corpus that does not include the NCEMA Executive Regulation, and NCEMA citations rest on an unofficial English translation: check them against the Arabic original.</div>
    ${soft.length ? `<div class="sec">Lower-confidence observations (${soft.length})</div>${soft.map((g,i) => gapCard(g, i+1, true)).join("")}` : ""}
    <div class="sec">Source limitation (not a finding)</div>
    <div class="limit"><h3>Source limitation</h3><div class="mute">Things the public corpus does not establish, such as detail delegated to an Executive Regulation that is not in the knowledge base. They describe what could be checked, not the policy.</div>
      <ul style="margin:10px 0 0;padding-left:20px">${uniq.map(l => `<li>${esc(l.why||l)} <small>(${esc(l.event_id||"")}, ${esc(human(l.agent||""))})</small></li>`).join("")}</ul><small>${lims.length} raised, ${uniq.length} distinct shown.</small></div>
    <div class="sec">Full gap report</div><div class="md">${md(S.report.gap_report)}</div>`;
  return `<div class="page"><div class="eyebrow">Step 3 · published documents only</div><h2 class="ptitle">What we found</h2>
    <p class="lead">${firm.length} evidence-supported findings. Each one is something the published documents do not say. They describe the documents, not how any institution behaves.</p>
    ${firm.map((g,i) => gapCard(g, i+1, false)).join("")}
    ${tech("gaps", inner)}</div>`;
}

/* ---------- Scorecard ---------- */
function renderScore(){
  const rows = parseScore(), run = S.run, ck = run.chain, ok = ck.grounded.ok && ck.baseline.ok;
  const rV = scoreFind(rows, /^Citation validity, strict/i), rU = scoreFind(rows, /^Unsupported mandate claims/i), rG = scoreFind(rows, /^Verifiable gaps/i);
  const pct = f => f && f.b ? Math.round(100*f.a/f.b) : 0;
  const bar = (f, cls) => `<div class="bar ${cls}"><i style="width:${pct(f)}%"></i></div>`;
  const core = rV && rV.bf && rV.gf ? `<div class="panel core"><div class="vs">
      <div class="g"><div class="who">AI with documents</div><div class="big">${rV.gf.a}/${rV.gf.b}</div>${bar(rV.gf,"grd")}<small>verified</small></div>
      <div class="b"><div class="who">AI without documents</div><div class="big">${rV.bf.a}/${rV.bf.b}</div>${bar(rV.bf,"base")}<small>verified</small></div></div>
      <p class="small" style="margin:14px 0 0">One run each. No statistical significance is claimed.</p></div>` : "";
  const m = (title, a, b) => `<div class="metric panel"><div class="mt">${title}</div><div class="vs"><div class="b"><div class="who">Plain LLM</div><div class="big">${a}</div></div><div class="g"><div class="who">KB-grounded</div><div class="big">${b}</div></div></div></div>`;
  const softN = ((S.report.gap_analysis||{}).gaps||[]).filter(x => LOWER_CONFIDENCE.includes(x.gap_id)).length;
  const metrics = `<div class="metrics">${rU ? m("Unsupported mandate claims left in the output", esc(leadInt(rU.base)), esc(leadInt(rU.grd))) : ""}${rG ? m(`Evidence-supported findings (grounded count includes ${softN} lower-confidence observations)`, esc(leadInt(rG.base)), esc(leadInt(rG.grd))) : ""}</div>`;
  const body = rows.map(r => `<tr><td class="m">${esc(r.metric)}</td><td>${esc(r.base)}</td><td>${esc(r.grd)}</td></tr>`).join("");
  const inner = `<div class="sec">How this was measured</div><div class="note">Same scenario, same roles, same inbox visibility, same verifier against the same KB. <b>One run per condition</b>; the same model family writes and verifies, so the human spot check (<code>report/spot_check.csv</code>) is the independent check. No significance is claimed.</div>
      ${metrics}<div class="scroll"><table class="cmp"><tr><th>Metric</th><th>Plain LLM (no KB)</th><th>KB-grounded</th></tr>${body}</table></div>
      <div class="sec">Full scorecard (buckets, topics, spot check)</div><div class="md">${md(S.report.scorecard)}</div>
      <div class="sec">Audit log</div>${auditInner(run)}
      <div class="sec">Plain AI answers (no knowledge base)</div>${baselineInner(run)}`;
  return `<div class="page"><div class="eyebrow">Step 4 · same scenario, same verifier</div><h2 class="ptitle">Results &amp; audit</h2>
    <div class="headline"><em>AI with documents</em> produced more verifiable claims</div>
    <p class="lead">The same scenario was run twice: once with the published documents, once without them. Both were checked the same way.</p>
    ${core}
    <div class="panel integrity"><span class="tag ${ok?"ok":"bad"}"><span class="dotp"></span>${ok ? "Audit chain intact" : "Audit chain BROKEN"}</span><small>Every step is recorded and linked to the previous one. Edits would break the chain.</small></div>
    ${tech("score", inner)}</div>`;
}

/* ---------- Audit chain: filterable activity feed ---------- */
function auditInner(run){
  const ck = run.chain, ok = ck.grounded.ok && ck.baseline.ok;
  const agents = [...new Set(run.grounded.map(r => r.agent))];
  const stat = r => apprState(r, run);
  const list = run.grounded.filter(r => (S.fAgent==="all" || r.agent===S.fAgent) && (S.fStatus==="all" || stat(r)===S.fStatus));
  const fb = (grp, v, label, count) => `<button class="fbtn ${S[grp]===v?"on":""}" data-f="${grp}:${v}">${esc(label)}${count!=null?` · ${count}`:""}</button>`;
  const cnt = s => run.grounded.filter(r => stat(r)===s).length;
  const items = list.map(r => { const act = r.recommended_action || {}, s = stat(r);
    const inner = `<div class="kv"><div class="k">Record hash</div><div><code>${esc(r.hash)}</code></div><div class="k">Previous hash</div><div><code>${esc(r.prev_hash)}</code></div>
        <div class="k">Event id</div><div>${esc(r.event_id)}</div><div class="k">Action</div><div><code>${esc(act.action)}</code></div>
        <div class="k">Evidence label</div><div>${esc(evLabel(r.evidence_status))}</div><div class="k">Flags (raw)</div><div>${(r.flags||[]).map(f=>`<span class="chip flag" title="${esc(f.why)}">${esc(f.flag)}</span>`).join("") || "none"}</div>
        <div class="k">Models</div><div>${esc(r.model)} · verifier ${esc(r.verifier_model||"")} · KB ${esc(r.kb_version)}</div></div><pre>${esc(JSON.stringify(r, null, 1))}</pre>`;
    return `<div class="panel fi ${s==="pending"?"pend":""}"><div class="row"><b>${esc(human(r.agent))} <small style="text-transform:none">· Event ${esc(r.event_id.replace("+followup"," follow-up"))}</small></b><span>${apprChip(r, run)}</span></div>
      <div class="act">${esc(actionLabel(act.action))}</div><div><span class="chip ${evClass(r.evidence_status)}">${esc(evShort(r.evidence_status))}</span><small> · ${new Date(r.ts*1000).toLocaleTimeString()} · hash ${esc(r.hash.slice(0,8))}</small></div>
      ${drawerBox("Audit detail", inner)}</div>`; }).join("");
  return `<div class="panel integrity"><span class="tag ${ok?"ok":"bad"}"><span class="dotp"></span>${ok ? "Chain intact" : "Chain BROKEN"}</span><small>grounded log: ${esc(ck.grounded.message)} · baseline log: ${esc(ck.baseline.message)}</small></div>
    <div class="filters"><span class="lbl">Agent</span>${fb("fAgent","all","All")}${agents.map(a => fb("fAgent", a, human(a))).join("")}</div>
    <div class="filters"><span class="lbl">Review</span>${fb("fStatus","all","All")}${fb("fStatus","pending","Needs review",cnt("pending"))}${fb("fStatus","approved","Approved",cnt("approved"))}${fb("fStatus","rejected","Rejected",cnt("rejected"))}</div>
    <div class="feed">${items || `<div class="panel mute">No records match these filters.</div>`}</div>`;
}

/* ---------- Baseline ---------- */
function baselineInner(run){
  const cards = run.baseline.map(r => `<div class="panel rec"><div class="hd"><div class="who">${avatar(r.agent,true)}<div><b>${esc(human(r.agent.replace("baseline:","")))}</b><small>plain LLM · Event ${esc(r.event_id)}</small></div></div><span class="chip">No sources checked</span></div>
    <p class="sum c3" style="margin-top:12px">${esc(r.reasoning_summary)}</p>
    ${(r.claims||[]).length ? drawerBox(`View details · ${r.claims.length} claims and the citations given`, r.claims.map(c=>`<div class="claim-row"><div class="t">${esc(c.text)}</div><div><span class="chip">${esc(c.claim_type)}</span> <small>citation (free text, unverified): ${esc(c.citation_text||"none")}</small></div></div>`).join("")) : "<small>No parseable claims.</small>"}</div>`).join("");
  return `<div class="note">Same roles and event visibility, no knowledge base. Its claims are scored by the same verifier against the KB (see Results).</div><div class="grid2">${cards}</div>`;
}

async function draw(){
  const run = S.run;
  $("chain").innerHTML = run ? `<span class="tag ${run.chain.grounded.ok&&run.chain.baseline.ok?"ok":"bad"}"><span class="dotp"></span>audit chain ${run.chain.grounded.ok&&run.chain.baseline.ok?"intact":"BROKEN"}</span>` : "";
  $("tabs").innerHTML = TABS.map(([k,l,sub]) => `<button class="navbtn ${k===S.tab?"on":""}" data-tab="${k}">${ICON[k]}<span><b>${l}</b><small>${sub}</small></span></button>`).join("");
  let h = "";
  if (!run) h = `<div class="panel">No run found. Run <code>python scripts/run_scenario.py</code> first.</div>`;
  else if (S.tab==="overview") h = renderOverview(run);
  else if (S.tab==="timeline") h = renderTimeline(run);
  else if (S.tab==="gaps") h = renderGaps();
  else if (S.tab==="score") h = renderScore();
  $("view").innerHTML = h;
  if (S.tab==="timeline" && $("ph")) { const ph = $("ph"); requestAnimationFrame(() => requestAnimationFrame(() => { ph.style.left = S.nextLeft + "%"; })); S.prevLeft = S.nextLeft; }
}

async function openChunk(id){
  const d = $("drawer"); d.classList.add("open"); d.innerHTML = "<small>loading…</small>";
  const c = await api("/api/chunk/" + encodeURIComponent(id));
  const closeBtn = `<button class="btn" id="x">Close</button>`;
  if (!c || c.error) { d.innerHTML = `${closeBtn}<p>Source not available here: <code>${esc(id)}</code></p>`; $("x").onclick = () => d.classList.remove("open"); return; }
  d.innerHTML = `${closeBtn}<div class="eyebrow" style="margin-top:18px">Evidence drawer</div><h3 style="margin:6px 0">${esc(c.article)}</h3><p class="mute">${esc(c.citation)}</p>
    <p><span class="chip">${esc(c.authority_status)}</span><span class="chip ${c.translation_status==="unofficial_translation"?"part":""}">${esc(c.translation_status)}</span></p>
    ${c.url ? `<p><a href="${esc(c.url)}" target="_blank" rel="noopener">Open the official source</a></p>` : ""}
    ${c.excerpt ? `<p class="mute"><small>Excerpt shown locally only; the source URL above is authoritative.</small></p><pre style="white-space:pre-wrap">${esc(c.excerpt)}</pre>` : `<p class="mute"><small>Passage text is not included in the shared export (publishers reserve rights); open the source URL.</small></p>`}`;
  $("x").onclick = () => d.classList.remove("open"); $("x").focus();
}

function stopPlay(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } }
function evList(){ return S.run.scenario.events.slice().sort((a,b)=>a.t_offset-b.t_offset); }
function startPlay(){
  const evs = evList(); S.ev = evs[0].event_id; S.prevLeft = 0; S.tech.timeline = false; draw();   // drawers stay closed while replaying
  S.timer = setInterval(() => { const i = evs.findIndex(e => e.event_id===S.ev); if (i >= evs.length-1) { stopPlay(); draw(); return; } S.ev = evs[i+1].event_id; draw(); }, 3600);
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-ev],[data-chunk],[data-dec],[data-play],[data-step],[data-f]") || e.target;
  if (t.dataset.tab) { stopPlay(); S.tab = t.dataset.tab; window.scrollTo({top:0}); return draw(); }
  if (t.dataset.play) { return S.timer ? (stopPlay(), draw()) : startPlay(); }
  if (t.dataset.step) { stopPlay(); const evs = evList(), i = evs.findIndex(x => x.event_id===S.ev); const j = Math.min(evs.length-1, Math.max(0, i + (+t.dataset.step))); S.ev = evs[j].event_id; return draw(); }
  if (t.dataset.ev) { stopPlay(); S.ev = t.dataset.ev; return draw(); }
  if (t.dataset.f) { const [k, v] = t.dataset.f.split(":"); S[k] = v; return draw(); }
  if (t.dataset.chunk) return openChunk(t.dataset.chunk);
  if (t.dataset.dec) {
    let by = $("who").value.trim();
    if (!by) { by = (prompt("Type your name to continue. Only a named human can approve or reject.") || "").trim(); if (!by) return; $("who").value = by; }
    const note = prompt("Optional note for the record:") || "";
    const r = await api("/api/approve", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ run_id:S.run.run_id, hash:t.dataset.hash, decision:t.dataset.dec, by, note }) });
    if (r.error) { alert(r.error); return; }
    await load(S.run.run_id);
  }
});
document.addEventListener("toggle", e => { const t = e.target; if (t.dataset && t.dataset.tech) S.tech[t.dataset.tech] = t.open; }, true);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("drawer").classList.remove("open");
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.chunk) { e.preventDefault(); openChunk(e.target.dataset.chunk); }
});

async function load(id){ S.run = await api("/api/run/" + id); draw(); }

/* ---------- low-opacity particle field (decoration only; static when reduced motion is requested) ---------- */
(function particles(){
  const c = $("fx"), x = c.getContext && c.getContext("2d"); if (!x) return;
  let w, h, P = [];
  const size = () => { w = c.width = innerWidth; h = c.height = innerHeight; P = Array.from({length: Math.min(60, Math.round(w*h/26000))}, () => ({ x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.4+.3, vx:(Math.random()-.5)*.12, vy:(Math.random()-.5)*.12, a:Math.random()*.5+.15 })); };
  const frame = () => { x.clearRect(0,0,w,h); for (const p of P) { if (!REDUCED) { p.x+=p.vx; p.y+=p.vy; if (p.x<0) p.x=w; if (p.x>w) p.x=0; if (p.y<0) p.y=h; if (p.y>h) p.y=0; }
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.283); x.fillStyle = `rgba(120,200,255,${p.a})`; x.fill(); }
    if (!REDUCED && !document.hidden) requestAnimationFrame(frame); else if (!REDUCED) setTimeout(()=>requestAnimationFrame(frame),500); };
  size(); addEventListener("resize", size); frame();
})();

(async function init(){
  $("mode").textContent = EXPORT ? "read-only export" : "local viewer";
  if (EXPORT) { $("whoLbl").style.display = "none"; }
  S.runs = await api("/api/runs"); S.report = await api("/api/report");
  $("runSel").innerHTML = S.runs.map(r => `<option>${esc(r)}</option>`).join("");
  $("runSel").onchange = ev => { S.ev = null; stopPlay(); load(ev.target.value); };
  if (S.runs.length) await load(S.runs[0]); else draw();
})();
</script>
