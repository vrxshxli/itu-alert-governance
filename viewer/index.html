<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alert Governance Stress-Test · a fictional public-alert simulation</title>
<meta name="description" content="A fictional simulation: when a public alert may be wrong, who can act? AI agents may only use published policy documents, cite their evidence, and a named human decides.">
<meta name="theme-color" content="#D6C8B8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110E" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%237E6655'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%23F3ECE2' stroke-opacity='.55' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23F3ECE2'/%3E%3C/svg%3E">
<style>
  /* ============ Design tokens: warm taupe & cream, soft light (light + dark) ============ */
  :root {
    color-scheme: light;
    --frame:#D6C8B8; --bg:#F3ECE2; --surface:#FBF7F1; --surface2:#F6EFE6; --sunk:#EDE4D7;
    --glass:rgba(252,248,242,.84); --glass-edge:rgba(255,255,255,.75);
    --ink:#4A3D33; --ink2:#5C4F44; --mute:#74655A; --dim:#968779;
    --line:#E6DCCE; --line2:#D3C4B2;
    --brand:#7E6655; --brand-ink:#FFFFFF; --brandbg:#EFE4D7;
    --band1:#8A7A6B; --band2:#9C8C7B; --band3:#B2A290; --on-band:#FFFDF9; --glow:#FFFFFF;
    --ok:#546A4D; --okbg:#E5EADC;
    --accent:#B08550; --ochre:#835614; --ochrebg:#F3E6CF;
    --clay:#9E4C37; --claybg:#F3DFD6;
    --sage:#4C7652; --sagebg:#E0EBDD;
    --plum:#7A5C70; --plumbg:#EFE4EA;
    --role-em:#A9783E; --role-tel:#5F7A6D; --role-pol:#86677E; --role-mun:#737C4E; --role-base:#A39689;
    --particle:176,138,90;
    --shadow-sm:0 1px 2px rgba(74,58,40,.06);
    --shadow:0 1px 2px rgba(74,58,40,.05), 0 18px 40px -22px rgba(74,58,40,.28);
    --shadow-lg:0 34px 80px -28px rgba(60,45,30,.42);
    --r:22px;
    --display:"Segoe UI Variable Display","SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --sans:"Segoe UI Variable Text","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --ease:cubic-bezier(.22,.7,.2,1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --frame:#14110E; --bg:#1A1613; --surface:#231E1A; --surface2:#28221D; --sunk:#1E1916;
      --glass:rgba(37,31,27,.86); --glass-edge:rgba(255,240,220,.08);
      --ink:#F1E9DE; --ink2:#D9CFC2; --mute:#AFA294; --dim:#8E8275;
      --line:#342C25; --line2:#473D34;
      --brand:#D9BFA3; --brand-ink:#2A211A; --brandbg:rgba(217,191,163,.12);
      --band1:#2B231D; --band2:#382E26; --band3:#4A3D33; --on-band:#F6EEE3; --glow:#F2D9B8;
      --ok:#AFC7A4; --okbg:rgba(175,199,164,.12);
      --accent:#E0B07A; --ochre:#E6BD80; --ochrebg:rgba(224,176,122,.13);
      --clay:#E9A28E; --claybg:rgba(233,162,142,.13);
      --sage:#A2C9A6; --sagebg:rgba(162,201,166,.12);
      --plum:#D2B4C8; --plumbg:rgba(210,180,200,.12);
      --role-em:#E0B07A; --role-tel:#9DB8AA; --role-pol:#C9A7BE; --role-mun:#B9C08F; --role-base:#9A8D80;
      --particle:224,176,122;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 18px 40px -20px rgba(0,0,0,.65);
      --shadow-lg:0 34px 80px -24px rgba(0,0,0,.75);
    }
  }

  /* ============ Base ============ */
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
  body { margin:0; padding-top:14px; color:var(--ink); font:16.5px/1.65 var(--sans); min-height:100vh;
         background:linear-gradient(180deg, var(--frame) 0, var(--bg) 640px) no-repeat, var(--bg);
         -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  h1,h2,h3,h4 { margin:0; line-height:1.2; font-family:var(--display); font-weight:550; letter-spacing:-.015em; }
  p { margin:0 0 12px; }
  a { color:var(--brand); text-underline-offset:3px; text-decoration-thickness:1px; }
  a:hover { text-decoration-thickness:2px; }
  code { font-family:var(--mono); background:var(--sunk); padding:1px 6px; border-radius:6px; font-size:.84em; color:var(--ink2); }
  ::selection { background:var(--brandbg); color:var(--ink); }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; border-radius:10px; }
  .skip { position:absolute; left:12px; top:-60px; z-index:60; background:var(--brand); color:var(--brand-ink); padding:10px 16px; border-radius:12px; font-weight:600; text-decoration:none; }
  .skip:focus { top:12px; }
  #fx { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5; }

  /* ============ Header: sits on the top panel; floats as a frosted bar once you scroll ============ */
  .site-top { position:sticky; top:10px; z-index:20; width:calc(100% - 28px); max-width:1200px; margin:0 auto; background:var(--band1); color:var(--on-band);
              border-radius:30px 30px 0 0; transition:border-radius .35s var(--ease), box-shadow .35s var(--ease), background .35s; }
  .site-top.solid { border-radius:22px; box-shadow:0 14px 40px -16px rgba(50,38,28,.55); background:rgba(138,122,107,.9); backdrop-filter:saturate(1.2) blur(14px); -webkit-backdrop-filter:saturate(1.2) blur(14px); }
  @media (prefers-color-scheme: dark) { .site-top.solid { background:rgba(43,35,29,.9); } }
  .topin { padding:16px clamp(18px,3vw,40px); display:flex; align-items:center; gap:16px; }
  .brand { display:flex; align-items:center; gap:12px; background:none; border:0; padding:4px 6px 4px 0; cursor:pointer; color:var(--on-band); font:inherit; text-align:left; flex:none; }
  .brand .logo { width:34px; height:34px; border-radius:10px; background:var(--on-band); display:grid; place-items:center; box-shadow:0 4px 14px -6px rgba(0,0,0,.35); flex:none; }
  .brand b { display:block; font-family:var(--display); font-size:18px; font-weight:550; line-height:1.1; letter-spacing:-.01em; }
  .brand small { display:block; font-size:12.5px; color:var(--on-band); opacity:.8; line-height:1.3; }
  .simmini { display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:600; letter-spacing:.12em; color:var(--on-band); background:rgba(255,255,255,.14); padding:5px 11px; border-radius:999px; white-space:nowrap; flex:none; }
  .simmini::before, .pill-o::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.85; }
  #tabs { margin-left:auto; display:flex; gap:2px; }
  .navbtn { display:flex; align-items:center; gap:8px; min-height:42px; padding:6px 15px; border-radius:999px; border:1px solid transparent; background:none; color:var(--on-band); opacity:.82; font:inherit; font-size:14.5px; cursor:pointer; white-space:nowrap; transition:opacity .25s, background .25s, border-color .25s; }
  .navbtn .num { font-size:12px; font-weight:600; opacity:.7; font-variant-numeric:tabular-nums; }
  .navbtn span b { display:block; font-weight:500; line-height:1.2; }
  .navbtn span small { display:none; }
  .navbtn:hover { opacity:1; background:rgba(255,255,255,.1); }
  .navbtn.on { opacity:1; border-color:rgba(255,255,255,.75); }
  @media (max-width:1040px) {
    .site-top { position:relative; top:0; }
    .topin { flex-wrap:wrap; gap:8px 12px; padding-bottom:8px; }
    .simmini { margin-left:auto; }
    #tabs { order:3; width:calc(100% + 16px); margin:0 -8px; padding:0 8px 2px; overflow-x:auto; scrollbar-width:none; }
    #tabs::-webkit-scrollbar { display:none; }
  }
  @media (max-width:560px) { .site-top { width:calc(100% - 16px); border-radius:24px 24px 0 0; } .brand small { display:none; } .navbtn { font-size:14px; padding:6px 12px; } }

  /* ============ Layout ============ */
  main { position:relative; z-index:1; max-width:1228px; margin:0 auto; padding:0 14px 30px; }
  @media (max-width:560px) { main { padding:0 8px 24px; } }
  .page { animation:rise .6s var(--ease) both; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .content { position:relative; z-index:2; max-width:1080px; margin:-104px auto 0; padding:0 clamp(6px,2.4vw,28px); }

  /* the top panel with a soft curve of light */
  .band { position:relative; overflow:hidden; border-radius:0 0 32px 32px; color:var(--on-band); text-align:center;
          background:linear-gradient(180deg, var(--band1) 0%, var(--band2) 48%, var(--band3) 100%); padding:clamp(26px,5vw,56px) 20px 230px; }
  .band.hero { padding-top:clamp(40px,7vw,86px); padding-bottom:290px; }
  .band::after { content:""; position:absolute; left:0; right:0; bottom:0; height:110px; background:linear-gradient(180deg, transparent, rgba(243,236,226,.22)); pointer-events:none; }
  @media (prefers-color-scheme: dark) { .band::after { background:linear-gradient(180deg, transparent, rgba(26,22,19,.35)); } }
  @media (max-width:560px) { .band { border-radius:0 0 24px 24px; padding-bottom:210px; } .band.hero { padding-bottom:240px; } .wave { height:230px; } .band.hero .wave { height:250px; } }
  .wave { position:absolute; left:0; right:0; bottom:0; width:100%; height:270px; pointer-events:none; } .band.hero .wave { height:350px; }
  .wv-a { stop-color:var(--glow); stop-opacity:.16; } .wv-b { stop-color:var(--glow); stop-opacity:0; }
  .wv-glow { fill:none; stroke:var(--glow); stroke-width:26; opacity:.32; animation:shine 9s ease-in-out infinite; }
  .wv-line2 { fill:none; stroke:var(--glow); stroke-width:7; opacity:.5; }
  .wv-line { fill:none; stroke:var(--glow); stroke-width:1.8; opacity:.95; }
  .wv-back { fill:none; stroke:var(--glow); stroke-width:1; opacity:.2; }
  @keyframes shine { 50% { opacity:.18; } }
  .band-in { position:relative; z-index:1; max-width:780px; margin:0 auto; }
  .pill-o { display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--on-band); border:1px solid rgba(255,255,255,.7); padding:7px 16px; border-radius:999px; }
  .band h1 { font-size:clamp(36px,5.8vw,64px); font-weight:550; line-height:1.06; letter-spacing:-.025em; margin:22px auto 18px; text-wrap:balance; text-shadow:0 2px 18px rgba(60,44,30,.18); }
  .band .ptitle { font-size:clamp(32px,4.8vw,52px); font-weight:550; line-height:1.08; letter-spacing:-.025em; margin:18px 0 12px; }
  .band p, .band .lead { color:var(--on-band); font-size:clamp(16.5px,1.6vw,19px); max-width:62ch; margin:0 auto; opacity:.94; text-shadow:0 1px 2px rgba(60,44,30,.22); }
  .band .headline { color:var(--on-band); }
  .band .headline em { color:var(--on-band); text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:6px; text-decoration-color:rgba(255,255,255,.55); }
  .band .cta { justify-content:center; }
  .band .btn { background:var(--surface); color:var(--ink); border-color:transparent; box-shadow:0 12px 30px -14px rgba(40,28,18,.6); }
  .band .btn:hover { background:#fff; }
  .band .btn.ghost { background:transparent; color:var(--on-band); border-color:rgba(255,255,255,.7); box-shadow:none; }
  .band .btn.ghost:hover { background:rgba(255,255,255,.12); }
  .band .hint { color:var(--on-band); opacity:.85; font-size:14px; margin-top:16px; }
  @media (prefers-color-scheme: dark) { .band .btn { background:var(--on-band); color:#2A211A; } }

  .eyebrow { display:inline-flex; align-items:center; gap:10px; font-size:13px; font-weight:600; color:var(--brand); letter-spacing:.04em; }
  .ptitle { font-size:clamp(30px,4vw,44px); margin:10px 0; }
  .lead { font-size:clamp(17px,1.6vw,19px); color:var(--ink2); max-width:60ch; margin:0 0 26px; }
  .panel { position:relative; background:var(--glass); border:1px solid var(--glass-edge); border-radius:var(--r); padding:clamp(18px,2.4vw,28px); margin-bottom:18px; box-shadow:var(--shadow);
           backdrop-filter:blur(18px) saturate(1.1); -webkit-backdrop-filter:blur(18px) saturate(1.1); overflow-wrap:anywhere; }
  .sec { font-size:13px; font-weight:600; color:var(--mute); margin:30px 0 12px; display:flex; align-items:center; gap:12px; letter-spacing:.06em; text-transform:uppercase; }
  .sec::after { content:""; flex:1; height:1px; background:var(--line); }
  .mute { color:var(--mute); } small, .small { color:var(--mute); font-size:13.5px; }
  .c2, .c3 { display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; } .c2 { -webkit-line-clamp:2; } .c3 { -webkit-line-clamp:3; }
  .scroll { overflow-x:auto; }
  .note { border-left:3px solid var(--accent); background:var(--ochrebg); padding:12px 16px; border-radius:0 14px 14px 0; font-size:15px; color:var(--ink); margin-bottom:14px; }
  .note.cyan { border-left-color:var(--brand); background:var(--brandbg); }

  /* ============ Chips, tags, buttons ============ */
  .chip { display:inline-flex; align-items:center; gap:6px; padding:3px 11px; border-radius:999px; font-size:13px; line-height:1.5; margin:2px 6px 2px 0; background:var(--sunk); color:var(--ink2); border:1px solid var(--line); vertical-align:middle; }
  .chip.ok, .chip.part, .chip.bad, .chip.green, .chip.flag { border-color:transparent; }
  .chip.ok::before, .chip.part::before, .chip.bad::before, .chip.green::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; }
  .chip.ok { color:var(--ok); background:var(--okbg); }
  .chip.part { color:var(--ochre); background:var(--ochrebg); }
  .chip.bad { color:var(--clay); background:var(--claybg); }
  .chip.green { color:var(--sage); background:var(--sagebg); }
  .chip.cite { font-family:var(--mono); font-size:12px; color:var(--brand); background:var(--surface); border:1px dashed var(--line2); cursor:pointer; transition:all .2s; }
  .chip.cite::after { content:"↗"; font-family:var(--sans); font-size:11px; opacity:.7; }
  .chip.cite:hover { border-style:solid; border-color:var(--brand); background:var(--brandbg); }
  .chip.flag { color:var(--plum); background:var(--plumbg); cursor:help; }
  .chip.lg { font-size:14px; padding:5px 14px; }
  .tag { display:inline-flex; align-items:center; gap:8px; padding:4px 12px; border-radius:999px; font-size:13px; font-weight:600; border:1px solid var(--line); color:var(--mute); background:var(--surface); width:fit-content; white-space:nowrap; }
  .tag.ok { color:var(--sage); background:var(--sagebg); border-color:transparent; }
  .tag.bad { color:var(--clay); background:var(--claybg); border-color:transparent; }
  .dotp { width:8px; height:8px; border-radius:50%; background:currentColor; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:10px 22px; border-radius:14px; border:1px solid var(--line2); background:var(--surface); color:var(--ink); font:inherit; font-size:15.5px; font-weight:600; cursor:pointer; text-decoration:none; transition:background .2s, border-color .2s, transform .2s var(--ease), box-shadow .2s, filter .2s; }
  .btn:hover { border-color:var(--brand); background:var(--surface2); }
  .btn:active { transform:translateY(1px); }
  .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); box-shadow:0 12px 26px -14px var(--brand); }
  .btn.primary:hover { filter:brightness(1.07); transform:translateY(-1px); }
  .btn.sm { min-height:40px; padding:7px 16px; font-size:14.5px; border-radius:12px; }
  .btn.go { color:var(--sage); border-color:var(--sage); } .btn.no { color:var(--clay); border-color:var(--clay); }

  /* ============ Folding sections ============ */
  .drawer-d { margin-top:16px; border:1px solid var(--line); border-radius:16px; background:var(--surface2); }
  .drawer-d > summary { cursor:pointer; list-style:none; min-height:48px; padding:11px 18px; display:flex; align-items:center; gap:12px; font-size:15px; font-weight:600; color:var(--brand); border-radius:16px; }
  .drawer-d > summary::-webkit-details-marker { display:none; }
  .drawer-d > summary::after { content:""; order:3; width:8px; height:8px; margin-left:auto; border-right:2px solid var(--mute); border-bottom:2px solid var(--mute); transform:rotate(45deg) translate(-2px,-2px); transition:transform .3s var(--ease); flex:none; }
  .drawer-d[open] > summary::after { transform:rotate(-135deg) translate(-2px,-2px); }
  .drawer-d > summary:hover { background:var(--sunk); }
  .drawer-d .in { padding:4px 20px 20px; color:var(--ink2); font-size:15.5px; }
  .drawer-d .in .sec { margin:20px 0 10px; }
  .tech { background:var(--glass); border:1px dashed var(--line2); margin-top:26px; }
  .tech > summary { font-size:16px; min-height:58px; }
  .tech > summary::before { content:"Optional · for reviewers and specialists"; order:2; margin-left:auto; font-size:13px; font-weight:500; color:var(--mute); }
  .tech > summary::after { margin-left:14px; }
  @media (max-width:560px) { .tech > summary::before { content:"Optional"; } }
  .kv { display:grid; grid-template-columns:160px minmax(0,1fr); gap:8px 16px; margin-top:12px; font-size:15px; }
  .kv .k { color:var(--mute); font-weight:600; font-size:13px; padding-top:2px; }
  @media (max-width:640px) { .kv { grid-template-columns:1fr; gap:2px 0; } .kv .k { margin-top:8px; } }
  .human { background:var(--ochrebg); border-radius:12px; color:var(--ink); padding:10px 14px; font-size:15px; margin:10px 0; } .human b { color:var(--ochre); }
  .claim-row { border-left:3px solid var(--line2); padding:6px 0 6px 14px; margin:12px 0; } .claim-row.ok { border-left-color:var(--ok); } .claim-row.part { border-left-color:var(--accent); } .claim-row.bad { border-left-color:var(--clay); }
  .claim-row .t { font-size:15px; color:var(--ink); margin-bottom:4px; } .struck { text-decoration:line-through; color:var(--dim); }
  pre { background:var(--sunk); padding:12px; border-radius:12px; overflow:auto; font:12px/1.5 var(--mono); max-height:260px; color:var(--ink2); border:1px solid var(--line); }
  .ev-item { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin:8px 0; font-size:15px; }

  /* ============ Overview ============ */
  .cta { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin:30px 0 0; }
  .hint { font-size:14.5px; color:var(--mute); margin:0; }
  .three { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:18px; margin-bottom:22px; }
  .blk { margin:0; display:flex; flex-direction:column; }
  .blk .k { display:flex; align-items:center; gap:12px; font-family:var(--display); font-size:18px; font-weight:550; color:var(--ink); margin-bottom:12px; }
  .blk .ic { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--brand); color:var(--brand-ink); flex:none; }
  .blk .ic svg { width:20px; height:20px; }
  .blk p { margin:0; font-size:16px; line-height:1.6; color:var(--ink2); }
  .blk .bignum { font-family:var(--display); font-size:52px; font-weight:500; line-height:1; letter-spacing:-.03em; color:var(--ink); margin:2px 0 14px; }
  .blk .bignum small { font-size:26px; color:var(--ink2); margin-left:2px; }
  .disc { font-size:15px; color:var(--ink2); background:var(--surface2); border:1px solid var(--line); border-radius:18px; padding:16px 20px; } .disc b { color:var(--ink); }
  .closing { font-family:var(--display); font-size:clamp(19px,2vw,23px); font-weight:450; line-height:1.5; color:var(--ink); text-align:center; max-width:46ch; margin:46px auto 0; }
  .closing::before { content:""; display:block; width:48px; height:2px; border-radius:2px; background:var(--accent); margin:0 auto 18px; }
  .nextstep { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:space-between; gap:14px 20px; flex-wrap:wrap; margin-top:44px; padding:24px 28px; border-radius:var(--r); color:var(--on-band);
              background:linear-gradient(120deg, var(--band1), var(--band3)); box-shadow:var(--shadow); }
  .nextstep span { font-family:var(--display); font-size:clamp(18px,1.8vw,21px); font-weight:500; }
  .nextstep .btn.primary { background:var(--surface); color:var(--ink); border-color:transparent; box-shadow:0 10px 24px -12px rgba(40,28,18,.6); }
  @media (prefers-color-scheme: dark) { .nextstep .btn.primary { background:var(--on-band); color:#2A211A; } }

  /* simulation drawings (colours follow the theme) */

async function api(path, opts) {
  if (EXPORT) {
    if (path === "/api/runs") return EXPORT.runs;
    if (path.startsWith("/api/run/")) return EXPORT.run;
    if (path === "/api/report") return EXPORT.report;
    if (path.startsWith("/api/chunk/")) return EXPORT.chunks[decodeURIComponent(path.slice(11))] || null;
    return null;
  }
  const r = await fetch(path, opts); return r.json();
}

function evClass(e){ return e==="confirmed" ? "ok" : e==="partially_supported" ? "part" : ""; }

const passing = c => c.verifier_status==="supported" || c.verifier_status==="partially_supported";

function md(src){  // small markdown renderer (headings, quotes, lists, tables, bold, code, links)
  const lines = String(src).split("\n"); let out = "", list = 0, tbl = [];
  const inl = t => esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const close = () => { while (list > 0) { out += "</ul>"; list--; } };
  const flushT = () => { if (!tbl.length) return; const rows = tbl.filter(r => !/^\|[\s:|-]+\|$/.test(r)).map(r => r.split("|").slice(1,-1).map(c => c.trim()));
      out += '<div class="scroll"><table>' + rows.map((r,i) => "<tr>" + r.map(c => (i?"<td>":"<th>") + inl(c) + (i?"</td>":"</th>")).join("") + "</tr>").join("") + "</table></div>"; tbl = []; };
  for (const raw of lines) {
    const l = raw.replace(/\s+$/,"");
    if (/^\|.*\|$/.test(l)) { close(); tbl.push(l); continue; } else flushT();
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { close(); out += `<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`; }
    else if ((m = l.match(/^>\s?(.*)$/))) { close(); out += `<blockquote>${inl(m[1])}</blockquote>`; }
    else if ((m = l.match(/^(\s*)[-*]\s+(.*)$/))) { const depth = Math.floor(m[1].length/2)+1; while (list < depth) { out += "<ul>"; list++; } while (list > depth) { out += "</ul>"; list--; } out += `<li>${inl(m[2])}</li>`; }
    else if (/^---+$/.test(l)) { close(); out += "<hr>"; }
    else if (l.trim()==="") { close(); }
    else { if (list && /^\s{2,}/.test(raw)) out += `<div class="mute">${inl(l.trim())}</div>`; else { close(); out += `<p>${inl(l)}</p>`; } }
  }
  close(); flushT(); return out;
}

  return s==="none" ? `<span class="chip">No review needed</span>` : s==="pending" ? `<span class="chip part">Needs review</span>` : `<span class="chip ${s==="approved"?"green":"bad"}">${cap(s)} by ${esc(a.by)}</span>`; }

/* ---------- scorecard parsing (numbers come from report/scorecard.md, not retyped) ---------- */
function parseScore(){
  const rows = []; let inTable = false, seenHeader = false;
  for (const l of String(S.report.scorecard).split("\n")) {
    if (/^\|/.test(l)) { if (/^\|[\s:|-]+\|$/.test(l)) { inTable = true; continue; } if (!seenHeader) { seenHeader = true; continue; } if (inTable) rows.push(l.split("|").slice(1,-1).map(c=>c.trim())); }
    else if (inTable) break;
  }
  return rows.map(r => { const f = c => { const m = (c||"").match(/(\d+)\s*\/\s*(\d+)/); return m ? { a:+m[1], b:+m[2] } : null; }; return { metric:r[0], base:r[1], grd:r[2], bf:f(r[1]), gf:f(r[2]) }; });
}
const scoreFind = (rows, re) => rows.find(r => re.test(r.metric));
const leadInt = c => { const m = String(c||"").match(/^\s*(\d+)/); return m ? +m[1] : null; };

function renderOverview(run){

function recordCard(r, run){
  const act = r.recommended_action || {};
  const req = r.human_approval.required, appr = run.approvals[r.hash];
  const buttons = (req && !appr && LIVE) ? `<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm go" data-dec="approved" data-hash="${r.hash}">Approve</button> <button class="btn sm no" data-dec="rejected" data-hash="${r.hash}">Reject</button></div>` : "";
  const flagsAll = r.flags || [], shown = flagsAll.slice(0,2);

  const inner = `<p>${esc(act.detail||"")}</p>

      ${rawFlags ? `<div class="sec">Flags (raw names)</div>${rawFlags}` : ""}

      <div class="sec">What this agent knew (inbox) and audit record</div>

      <small>hash ${esc(r.hash)}<br>prev ${esc(r.prev_hash)}<br>model ${esc(r.model)} · verifier ${esc(r.verifier_model||"")} · KB ${esc(r.kb_version)}</small>
      <pre>${esc(JSON.stringify(r, null, 1))}</pre>`;
  return `<div class="panel rec">
    <div class="hd"><div class="who">${avatar(r.agent)}<div><b>${esc(human(r.agent))}</b><small>${esc(r.event_id.includes("+") ? "follow-up" : "first response")}</small></div></div>${apprChip(r, run)}</div>
    <div class="do">${esc(actionLabel(act.action))}</div>
    <p class="sum c2">${esc(firstSentence(act.detail||r.reasoning_summary))}</p>

function renderTimeline(run){
  const evs = run.scenario.events.slice().sort((a,b)=>a.t_offset-b.t_offset);
  if (!S.ev) S.ev = evs[0].event_id;
  const idx = evs.findIndex(e => e.event_id===S.ev), ev = evs[idx];
  const maxT = Math.max(...evs.map(e => e.t_offset)) || 1;
  const left = e => 6 + 88 * (e.t_offset / maxT);
  const marks = evs.map((e,i) => `<button class="tev ${i===idx?"on":i<idx?"past":""}" style="left:${left(e)}%" data-ev="${e.event_id}" aria-label="Event ${i+1}, t+${e.t_offset} minutes"${i===idx?' aria-current="step"':""}><span class="d"></span><b>${i+1}</b><i>t+${e.t_offset}m</i></button>`).join("");
  const recs = run.grounded.filter(r => r.event_id === S.ev || r.event_id.startsWith(S.ev+"+"));
  const pend = recs.filter(r => r.human_approval.required && !run.approvals[r.hash]).length, reqd = recs.filter(r => r.human_approval.required).length;
  const recv = ev.visible_to.map(a => `<span class="recvchip">${avatar(a)}${esc(human(a))}</span>`).join("");
  const next = recs.map(r => `<div class="nx"><b>${esc(human(r.agent))}</b>: ${esc(actionLabel((r.recommended_action||{}).action))}<small class="c2">${esc(firstSentence((r.recommended_action||{}).detail||r.reasoning_summary))}</small></div>`).join("");
  const full = String(ev.content||"").trim(), first = firstSentence(full);
  const review = reqd ? (pend ? `<span class="chip part lg">Yes, human review needed</span><div class="small" style="margin-top:8px">${pend} of ${reqd} proposals are waiting.${LIVE ? " Open Technical evidence below to approve or reject." : ""}</div>` : `<span class="chip green lg">Reviewed</span><div class="small" style="margin-top:8px">All ${reqd} proposals have a decision.</div>`) : "No review needed";
  const inner = `<div class="sec">Full event text</div><p>${esc(full)}</p>
    <div class="sec">What is uncertain</div><p class="mute">${esc(ev.uncertainty)}</p>
    <div class="sec">Agent responses (${recs.length})</div>${recs.length ? `<div class="grid2">${recs.map(r => recordCard(r, run)).join("")}</div>` : `<div class="mute">No agent step for this event.</div>`}`;
  S.nextLeft = left(ev);
  return `<div class="page">${band(`<span class="pill-o">Step 2 · fictional replay</span><h2 class="ptitle">What happened</h2>
    <p class="lead">Six fictional events, one at a time. Pick an event, or press Replay.</p>`)}
    <div class="content">
    <div class="panel replay"><div class="top"><div class="progress" aria-live="polite">Event <em>${idx+1}</em> of ${evs.length} <small>· t+${ev.t_offset} min</small></div>
      <div class="stepbtns"><button class="btn sm" data-step="-1" ${idx===0?"disabled":""}>Previous</button><button class="btn sm" data-step="1" ${idx===evs.length-1?"disabled":""}>Next</button><button class="btn sm primary" data-play="1">${S.timer ? "Pause" : "Replay"}</button></div></div>
      <div class="track"><div class="line"></div><div class="done" style="width:${left(ev)}%"></div><div class="playhead" id="ph" style="left:${S.prevLeft}%"></div>${marks}</div></div>
    <div class="legend" aria-label="What the labels mean"><span><span class="chip ok">Verified</span> a published document supports it</span><span><span class="chip part">Partly supported</span> the documents back only part of it</span><span><span class="chip">Not established</span> the published documents do not say</span></div>
    <div class="panel evbig"><div class="q0">What happened</div><div class="what">${esc(first)}</div>
      <div class="qa">
        <div><div class="q">Who received it</div><div class="a"><div class="recv" style="margin:0">${recv}</div></div></div>
        <div><div class="q">Recommended next step</div><div class="a">${next || "No agent step for this event."}</div></div>
        <div><div class="q">Human review needed?</div><div class="a">${review}</div></div></div></div>
    ${tech("timeline", inner)}
    ${nextStep("timeline")}</div></div>`;
}

/* ---------- Evidence-supported findings ---------- */
function gapTitle(t){ return { decision_owner_unclear:"No event-specific decision owner identified", correction_procedure_not_established:"No correction or cancellation procedure established",
  interface_unclear:"Interface between bodies unclear", ambiguous_provision:"Provision can be read more than one way", mandate_not_established:"Mandate not established" }[t] || cap(human(t)); }

function gapCard(g, n, soft){
  const unofficial = (g.evidence||[]).some(e => String(e.chunk_id).includes("unofficial"));
  const sev = (g.severity||{}).level || "";
  const ev = (g.evidence||[]).map(e => `<div class="ev-item">${citeChip(e.chunk_id)}<div style="margin-top:6px">${esc(e.why)}</div></div>`).join("");
  const gc = g.global_comparison ? `<div class="sec">Global comparison</div><div class="ev-item">${citeChip(g.global_comparison.chunk_id)}<div style="margin-top:6px">${esc(g.global_comparison.why || g.global_comparison.summary || "")}</div></div>` : "";
  const inner = `<p><small>${soft ? "Observation" : "Finding"} ${n} · listed as <code>${esc(g.gap_id)}</code> in the report · type <code>${esc(g.type)}</code></small></p>
    <div class="kv"><div class="k">Affected roles</div><div>${(g.affected_institutions||[]).map(a=>`<span class="chip">${esc(human(a))}</span>`).join("")}</div>
      <div class="k">Direction (domain level)</div><div>${esc(g.direction||"")}</div></div>
    <div class="sec">What the sources give, and what they do not</div>${ev}${gc}
    <div class="sec">Verification note and traceability</div><p class="mute">${esc(g.verifier_notes||"")}</p><small>Traceable to ${(g.source_records||[]).length} audit records.</small>`;
  return `<div class="panel gap ${soft?"obs":sev}"><span class="sevbar" aria-hidden="true"></span>
    <div>${soft ? `<span class="chip">Lower-confidence observation</span>` : `<span class="chip sev-${esc(sev)} lg">${cap(esc(sev))} severity</span>`}
      <span class="chip ${unofficial?"part":"ok"}">${unofficial ? "Partly supported · unofficial translation" : "Evidence checked"}</span></div>
    <h3>${esc(gapTitle(g.type))}</h3>
    <div class="lbl">Why it matters</div><div class="txt">${esc((g.severity||{}).rationale||"")}</div>
    <div class="lbl">What the documents do not say</div><div class="txt c3">${esc(g.description)}</div>
    ${drawerBox("View evidence", inner)}</div>`;
}

function renderGaps(){
  const ga = S.report.gap_analysis || {gaps:[], documentation_limitations:[]};
  const firm = ga.gaps.filter(g => !LOWER_CONFIDENCE.includes(g.gap_id)), soft = ga.gaps.filter(g => LOWER_CONFIDENCE.includes(g.gap_id));
  const lims = ga.documentation_limitations || [];
  const seen = new Set(), uniq = lims.filter(l => { const k = (l.why||l).slice(0,90); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0,8);
  const inner = `<div class="note">Gaps describe what the <b>published documents</b> establish, not how any institution behaves. Each depends on a corpus that does not include the NCEMA Executive Regulation, and NCEMA citations rest on an unofficial English translation: check them against the Arabic original.</div>
    ${soft.length ? `<div class="sec">Lower-confidence observations (${soft.length})</div>${soft.map((g,i) => gapCard(g, i+1, true)).join("")}` : ""}
    <div class="sec">Source limitation (not a finding)</div>
    <div class="limit"><h3>Source limitation</h3><div class="mute">Things the public corpus does not establish, such as detail delegated to an Executive Regulation that is not in the knowledge base. They describe what could be checked, not the policy.</div>
      <ul style="margin:10px 0 0;padding-left:20px">${uniq.map(l => `<li>${esc(l.why||l)} <small>(${esc(l.event_id||"")}, ${esc(human(l.agent||""))})</small></li>`).join("")}</ul><small>${lims.length} raised, ${uniq.length} distinct shown.</small></div>
    <div class="sec">Full gap report</div><div class="md">${md(S.report.gap_report)}</div>`;
  return `<div class="page">${band(`<span class="pill-o">Step 3 · published documents only</span><h2 class="ptitle">What we found</h2>
    <p class="lead">${firm.length} evidence-supported findings. Each one is something the published documents do not say. They describe the documents, not how any institution behaves.</p>`)}
    <div class="content">
    ${firm.map((g,i) => gapCard(g, i+1, false)).join("")}
    ${tech("gaps", inner)}
    ${nextStep("gaps")}</div></div>`;
}

/* ---------- Scorecard ---------- */
function renderScore(){
  const rows = parseScore(), run = S.run, ck = run.chain, ok = ck.grounded.ok && ck.baseline.ok;
  const rV = scoreFind(rows, /^Citation validity, strict/i), rU = scoreFind(rows, /^Unsupported mandate claims/i), rG = scoreFind(rows, /^Verifiable gaps/i);
  const pct = f => f && f.b ? Math.round(100*f.a/f.b) : 0;
  const bar = (f, cls) => `<div class="bar ${cls}"><i style="width:${pct(f)}%"></i></div>`;
  const core = rV && rV.bf && rV.gf ? `<div class="panel core"><div class="vs">
      <div class="g"><div class="who">AI with documents</div><div class="big">${rV.gf.a}/${rV.gf.b}</div>${bar(rV.gf,"grd")}<small>verified</small></div>
      <div class="b"><div class="who">AI without documents</div><div class="big">${rV.bf.a}/${rV.bf.b}</div>${bar(rV.bf,"base")}<small>verified</small></div></div>
      <p class="small" style="margin:16px 0 0">One run each. No statistical significance is claimed.</p></div>` : "";
  const m = (title, a, b) => `<div class="metric panel"><div class="mt">${title}</div><div class="vs"><div class="b"><div class="who">Plain LLM</div><div class="big">${a}</div></div><div class="g"><div class="who">KB-grounded</div><div class="big">${b}</div></div></div></div>`;
  const softN = ((S.report.gap_analysis||{}).gaps||[]).filter(x => LOWER_CONFIDENCE.includes(x.gap_id)).length;
  const metrics = `<div class="metrics">${rU ? m("Unsupported mandate claims left in the output", esc(leadInt(rU.base)), esc(leadInt(rU.grd))) : ""}${rG ? m(`Evidence-supported findings (grounded count includes ${softN} lower-confidence observations)`, esc(leadInt(rG.base)), esc(leadInt(rG.grd))) : ""}</div>`;
  const body = rows.map(r => `<tr><td class="m">${esc(r.metric)}</td><td>${esc(r.base)}</td><td>${esc(r.grd)}</td></tr>`).join("");
  const inner = `<div class="sec">How this was measured</div><div class="note">Same scenario, same roles, same inbox visibility, same verifier against the same KB. <b>One run per condition</b>; the same model family writes and verifies, so the human spot check (<code>report/spot_check.csv</code>) is the independent check. No significance is claimed.</div>
      ${metrics}<div class="scroll"><table class="cmp"><tr><th>Metric</th><th>Plain LLM (no KB)</th><th>KB-grounded</th></tr>${body}</table></div>
      <div class="sec">Full scorecard (buckets, topics, spot check)</div><div class="md">${md(S.report.scorecard)}</div>
      <div class="sec">Audit log</div>${auditInner(run)}
      <div class="sec">Plain AI answers (no knowledge base)</div>${baselineInner(run)}`;
  return `<div class="page">${band(`<span class="pill-o">Step 4 · same scenario, same verifier</span><h2 class="ptitle">Results &amp; audit</h2>
    <div class="headline"><em>AI with documents</em> produced more verifiable claims</div>
    <p class="lead">The same scenario was run twice: once with the published documents, once without them. Both were checked the same way.</p>`)}
    <div class="content">
    ${core}
    <div class="panel integrity"><span class="tag ${ok?"ok":"bad"}"><span class="dotp"></span>${ok ? "Audit chain intact" : "Audit chain BROKEN"}</span><small>Every step is recorded and linked to the previous one. Edits would break the chain.</small></div>
    ${tech("score", inner)}
    ${nextStep("score")}</div></div>`;
}

/* ---------- Audit chain: filterable activity feed ---------- */
function auditInner(run){
  const ck = run.chain, ok = ck.grounded.ok && ck.baseline.ok;
  const agents = [...new Set(run.grounded.map(r => r.agent))];
  const stat = r => apprState(r, run);
  const list = run.grounded.filter(r => (S.fAgent==="all" || r.agent===S.fAgent) && (S.fStatus==="all" || stat(r)===S.fStatus));
  const fb = (grp, v, label, count) => `<button class="fbtn ${S[grp]===v?"on":""}" data-f="${grp}:${v}" aria-pressed="${S[grp]===v}">${esc(label)}${count!=null?` · ${count}`:""}</button>`;
  const cnt = s => run.grounded.filter(r => stat(r)===s).length;
  const items = list.map(r => { const act = r.recommended_action || {}, s = stat(r);
    const inner = `<div class="kv"><div class="k">Record hash</div><div><code>${esc(r.hash)}</code></div><div class="k">Previous hash</div><div><code>${esc(r.prev_hash)}</code></div>
        <div class="k">Event id</div><div>${esc(r.event_id)}</div><div class="k">Action</div><div><code>${esc(act.action)}</code></div>
        <div class="k">Evidence label</div><div>${esc(evLabel(r.evidence_status))}</div><div class="k">Flags (raw)</div><div>${(r.flags||[]).map(f=>`<span class="chip flag" title="${esc(f.why)}">${esc(f.flag)}</span>`).join("") || "none"}</div>
        <div class="k">Models</div><div>${esc(r.model)} · verifier ${esc(r.verifier_model||"")} · KB ${esc(r.kb_version)}</div></div><pre>${esc(JSON.stringify(r, null, 1))}</pre>`;
    return `<div class="panel fi ${s==="pending"?"pend":""}"><div class="row"><b>${esc(human(r.agent))} <small style="text-transform:none">· Event ${esc(r.event_id.replace("+followup"," follow-up"))}</small></b><span>${apprChip(r, run)}</span></div>
      <div class="act">${esc(actionLabel(act.action))}</div><div><span class="chip ${evClass(r.evidence_status)}">${esc(evShort(r.evidence_status))}</span><small> · ${new Date(r.ts*1000).toLocaleTimeString()} · hash ${esc(r.hash.slice(0,8))}</small></div>
      ${drawerBox("Audit detail", inner)}</div>`; }).join("");
  return `<div class="panel integrity"><span class="tag ${ok?"ok":"bad"}"><span class="dotp"></span>${ok ? "Chain intact" : "Chain BROKEN"}</span><small>grounded log: ${esc(ck.grounded.message)} · baseline log: ${esc(ck.baseline.message)}</small></div>
    <div class="filters"><span class="lbl">Agent</span>${fb("fAgent","all","All")}${agents.map(a => fb("fAgent", a, human(a))).join("")}</div>
    <div class="filters"><span class="lbl">Review</span>${fb("fStatus","all","All")}${fb("fStatus","pending","Needs review",cnt("pending"))}${fb("fStatus","approved","Approved",cnt("approved"))}${fb("fStatus","rejected","Rejected",cnt("rejected"))}</div>
    <div class="feed">${items || `<div class="panel mute">No records match these filters.</div>`}</div>`;
}

/* ---------- Baseline ---------- */
function baselineInner(run){
  const cards = run.baseline.map(r => `<div class="panel rec"><div class="hd"><div class="who">${avatar(r.agent,true)}<div><b>${esc(human(r.agent.replace("baseline:","")))}</b><small>plain LLM · Event ${esc(r.event_id)}</small></div></div><span class="chip">No sources checked</span></div>
    <p class="sum c3" style="margin-top:12px">${esc(r.reasoning_summary)}</p>
    ${(r.claims||[]).length ? drawerBox(`View details · ${r.claims.length} claims and the citations given`, r.claims.map(c=>`<div class="claim-row"><div class="t">${esc(c.text)}</div><div><span class="chip">${esc(c.claim_type)}</span> <small>citation (free text, unverified): ${esc(c.citation_text||"none")}</small></div></div>`).join("")) : "<small>No parseable claims.</small>"}</div>`).join("");
  return `<div class="note">Same roles and event visibility, no knowledge base. Its claims are scored by the same verifier against the KB (see Results).</div><div class="grid2">${cards}</div>`;
}

async function draw(){
  const run = S.run;
  $("chain").innerHTML = run ? `<span class="tag ${run.chain.grounded.ok&&run.chain.baseline.ok?"ok":"bad"}"><span class="dotp"></span>audit chain ${run.chain.grounded.ok&&run.chain.baseline.ok?"intact":"BROKEN"}</span>` : "";
  $("tabs").innerHTML = TABS.map(([k,l,sub],i) => `<button class="navbtn ${k===S.tab?"on":""}" data-tab="${k}" title="${sub}"${k===S.tab?' aria-current="page"':""}><span class="num">${i+1}</span><span><b>${l}</b><small>${sub}</small></span></button>`).join("");
  let h = "";
  if (!run) h = `<div class="panel">No run found. Run <code>python scripts/run_scenario.py</code> first.</div>`;
  else if (S.tab==="overview") h = renderOverview(run);
  else if (S.tab==="timeline") h = renderTimeline(run);
  else if (S.tab==="gaps") h = renderGaps();
  else if (S.tab==="score") h = renderScore();
  $("view").innerHTML = h;
  const on = document.querySelector(".navbtn.on"); if (on && on.scrollIntoView && $("tabs").scrollWidth > $("tabs").clientWidth) on.scrollIntoView({block:"nearest", inline:"center"});
  if (S.tab==="timeline" && $("ph")) { const ph = $("ph"); requestAnimationFrame(() => requestAnimationFrame(() => { ph.style.left = S.nextLeft + "%"; })); S.prevLeft = S.nextLeft; }
}

async function openChunk(id){
  const d = $("drawer"); d.classList.add("open"); d.innerHTML = "<small>Loading…</small>";
  const c = await api("/api/chunk/" + encodeURIComponent(id));
  const closeBtn = `<button class="btn sm" id="x">Close</button>`;
  if (!c || c.error) { d.innerHTML = `${closeBtn}<p style="margin-top:18px">Source not available here: <code>${esc(id)}</code></p>`; $("x").onclick = () => d.classList.remove("open"); return; }
  d.innerHTML = `${closeBtn}<div class="eyebrow">Evidence drawer</div><h3 style="margin:8px 0">${esc(c.article)}</h3><p class="mute">${esc(c.citation)}</p>
    <p><span class="chip">${esc(c.authority_status)}</span><span class="chip ${c.translation_status==="unofficial_translation"?"part":""}">${esc(c.translation_status)}</span></p>
    ${c.url ? `<p><a class="btn" href="${esc(c.url)}" target="_blank" rel="noopener">Open the official source <span aria-hidden="true">↗</span></a></p>` : ""}
    ${c.excerpt ? `<p class="mute"><small>Excerpt shown locally only; the source URL above is authoritative.</small></p><pre style="white-space:pre-wrap">${esc(c.excerpt)}</pre>` : `<p class="mute"><small>Passage text is not included in the shared export (publishers reserve rights); open the source URL.</small></p>`}`;
  $("x").onclick = () => d.classList.remove("open"); $("x").focus();
}

function stopPlay(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } }
function evList(){ return S.run.scenario.events.slice().sort((a,b)=>a.t_offset-b.t_offset); }
function startPlay(){
  const evs = evList(); S.ev = evs[0].event_id; S.prevLeft = 0; S.tech.timeline = false; draw();   // drawers stay closed while replaying
  S.timer = setInterval(() => { const i = evs.findIndex(e => e.event_id===S.ev); if (i >= evs.length-1) { stopPlay(); draw(); return; } S.ev = evs[i+1].event_id; draw(); }, 3600);
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-ev],[data-chunk],[data-dec],[data-play],[data-step],[data-f]") || e.target;
  if (t.dataset.tab) { stopPlay(); S.tab = t.dataset.tab; window.scrollTo({top:0}); return draw(); }
  if (t.dataset.play) { return S.timer ? (stopPlay(), draw()) : startPlay(); }
  if (t.dataset.step) { stopPlay(); const evs = evList(), i = evs.findIndex(x => x.event_id===S.ev); const j = Math.min(evs.length-1, Math.max(0, i + (+t.dataset.step))); S.ev = evs[j].event_id; return draw(); }
  if (t.dataset.ev) { stopPlay(); S.ev = t.dataset.ev; return draw(); }
  if (t.dataset.f) { const [k, v] = t.dataset.f.split(":"); S[k] = v; return draw(); }
  if (t.dataset.chunk) return openChunk(t.dataset.chunk);
  if (t.dataset.dec) {
    let by = $("who").value.trim();
    if (!by) { by = (prompt("Type your name to continue. Only a named human can approve or reject.") || "").trim(); if (!by) return; $("who").value = by; }
    const note = prompt("Optional note for the record:") || "";
    const r = await api("/api/approve", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ run_id:S.run.run_id, hash:t.dataset.hash, decision:t.dataset.dec, by, note }) });
    if (r.error) { alert(r.error); return; }
    await load(S.run.run_id);
  }
});
document.addEventListener("toggle", e => { const t = e.target; if (t.dataset && t.dataset.tech) S.tech[t.dataset.tech] = t.open; }, true);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("drawer").classList.remove("open");
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.chunk) { e.preventDefault(); openChunk(e.target.dataset.chunk); }
});

async function load(id){ S.run = await api("/api/run/" + id); draw(); }

/* header turns into a floating frosted bar once the page scrolls (presentation only) */
addEventListener("scroll", () => { const h = $("hdr"); if (h) h.classList.toggle("solid", scrollY > 24); }, { passive:true });

/* ---------- a few slow, faint drifting specks (decoration only; hidden when reduced motion is requested) ---------- */
(function particles(){
  const c = $("fx"), x = c && c.getContext && c.getContext("2d"); if (!x) return;
  let w, h, P = [], rgb = "201,138,46";
  const size = () => { w = c.width = innerWidth; h = c.height = innerHeight; rgb = (getComputedStyle(document.documentElement).getPropertyValue("--particle") || rgb).trim() || rgb;
    P = Array.from({length: Math.min(34, Math.round(w*h/42000))}, () => ({ x:Math.random()*w, y:Math.random()*h, r:Math.random()*2+.6, vx:(Math.random()-.5)*.1, vy:(Math.random()-.5)*.1, a:Math.random()*.3+.12 })); };
  const frame = () => { x.clearRect(0,0,w,h); for (const p of P) { if (!REDUCED) { p.x+=p.vx; p.y+=p.vy; if (p.x<0) p.x=w; if (p.x>w) p.x=0; if (p.y<0) p.y=h; if (p.y>h) p.y=0; }
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.283); x.fillStyle = `rgba(${rgb},${p.a})`; x.fill(); }
    if (!REDUCED && !document.hidden) requestAnimationFrame(frame); else if (!REDUCED) setTimeout(()=>requestAnimationFrame(frame),500); };
  size(); addEventListener("resize", size); frame();
})();

(async function init(){
  $("mode").textContent = EXPORT ? "read-only export" : "local viewer";
  if (EXPORT) { $("whoLbl").style.display = "none"; }
  S.runs = await api("/api/runs"); S.report = await api("/api/report");
  $("runSel").innerHTML = S.runs.map(r => `<option>${esc(r)}</option>`).join("");
  $("runSel").onchange = ev => { S.ev = null; stopPlay(); load(ev.target.value); };
  if (S.runs.length) await load(S.runs[0]); else draw();
})();
</script>
