thoritative English translation of Article 15 states that the National Security Adviser may issue directives determining the emergency level, activating emergency, crisis and disaster management teams at local or national level, and determining meeting places when necessary.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art15"], "evidence_status": "partially_supported"}, {"record": "b1bf083cec593604bdd1dfba02f21032c842e3de8955cdd7ab40422455a22815", "event_id": "E3+followup", "agent": "emergency_management", "claim": "TDRA Technical Specification TS FS 001 describes UAE-Alert as a public warning service using channels including UAE mobile networks through Cell Broadcast technology to disseminate warning alerts issued by authorities to the public in times of crisis.", "cited_chunk_ids": ["ae-tdra-ts-fs-001:w002"], "evidence_status": "confirmed"}, {"record": "613cb917439aca89b8bbdd64dd535d746f9e7f6a0b183a8c42a19ff73474da34", "event_id": "E3+followup", "agent": "policy_adviser", "claim": "A UAE public telecommunications license provision states that, if a competent authority declares a public emergency, the licensee shall comply with any direction given by TDRA or another competent authority concerning the licensee's property or its use or operation.", "cited_chunk_ids": ["ae-tdra-licence-3-2026:art8"], "evidence_status": "confirmed"}, {"record": "613cb917439aca89b8bbdd64dd535d746f9e7f6a0b183a8c42a19ff73474da34", "event_id": "E3+followup", "agent": "policy_adviser", "claim": "The same UAE licence provision states that the licensee shall comply with directions issued by TDRA or another competent authority on matters relating to public interest, safety, and/or national security.", "cited_chunk_ids": ["ae-tdra-licence-3-2026:art8"], "evidence_status": "confirmed"}, {"record": "613cb917439aca89b8bbdd64dd535d746f9e7f6a0b183a8c42a19ff73474da34", "event_id": "E3+followup", "agent": "policy_adviser", "claim": "The UAE telecommunications decree-law provision cited gives the Authority's Board competences including issuing general guidelines or instructions related to the telecommunications sector based on national-security or international-relations requirements after Cabinet approval, and issuing resolutions, rules, regulations, and instructions related to implementing the law and its implementing regulations.", "cited_chunk_ids": ["ae-dl-3-2003-telecom:art10"], "evidence_status": "confirmed"}, {"record": "613cb917439aca89b8bbdd64dd535d746f9e7f6a0b183a8c42a19ff73474da34", "event_id": "E3+followup", "agent": "policy_adviser", "claim": "The retrieved NCEMA establishment-law text is expressly marked as an unofficial, non-authoritative translation; it says relevant bodies, each according to its competence, shall take necessary measures for emergency, crisis, and disaster response and recovery plans in coordination with the Authority, including warning and guiding community members, and that the Executive Regulation determines the relevant bodies' roles and responsibilities.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art14"], "evidence_status": "partially_supported"}, {"record": "613cb917439aca89b8bbdd64dd535d746f9e7f6a0b183a8c42a19ff73474da34", "event_id": "E3+followup", "agent": "policy_adviser", "claim": "A UAE Federal Authority for Ambulance and Civil Defense provision requires competent authorities and concerned entities to provide requested information related to ambulance and civil-defense works and measures, and requires competent authorities to coordinate and cooperate with that Authority in providing related services whenever necessary.", "cited_chunk_ids": ["ae-dl-8-2025-faacd:art7"], "evidence_status": "confirmed"}, {"record": "613cb917439aca89b8bbdd64dd535d746f9e7f6a0b183a8c42a19ff73474da34", "event_id": "E3+followup", "agent": "policy_adviser", "claim": "As a global technical comparison, CAP describes a false-alarm repudiation scenario in which officials issue a cancellation message that refers directly to the erroneous prior alert, downstream systems stop delivery where still in process, broadcast systems deliver a cancellation message, and other systems reset to normal.", "cited_chunk_ids": ["itu-x1303bis-cap:w018"], "evidence_status": "confirmed"}, {"record": "613cb917439aca89b8bbdd64dd535d746f9e7f6a0b183a8c42a19ff73474da34", "event_id": "E3+followup", "agent": "policy_adviser", "claim": "As a United States comparison, the FCC Hawaii report states that a cancellation is an instruction to downstream EAS and WEA equipment to cease retransmission, does not generate a new alert transmission such as an all-clear message, and does not recall messages already transmitted and displayed.", "cited_chunk_ids": ["us-fcc-hawaii-2018:w033"], "evidence_status": "confirmed"}, {"record": "613cb917439aca89b8bbdd64dd535d746f9e7f6a0b183a8c42a19ff73474da34", "event_id": "E3+followup", "agent": "policy_adviser", "claim": "As a United States comparison, the FCC Hawaii report describes post-incident measures including a two-person activation/verification rule and templates for EAS and WEA messages to correct a false alarm, noting that before the false alert there were no protocols or training on how to issue a correction or what to do if a false alert was initiated.", "cited_chunk_ids": ["us-fcc-hawaii-2018:w062"], "evidence_status": "confirmed"}, {"record": "613cb917439aca89b8bbdd64dd535d746f9e7f6a0b183a8c42a19ff73474da34", "event_id": "E3+followup", "agent": "policy_adviser", "claim": "As an EU comparison, the European Electronic Communications Code requires Member States to ensure that, when public warning systems for imminent or developing major emergencies and disasters are in place, public warnings are transmitted by providers of mobile number-based interpersonal communications services to concerned end-users, with possible equivalent alternatives.", "cited_chunk_ids": ["eu-eecc-2018-1972:art110"], "evidence_status": "confirmed"}, {"record": "0e88a2e6b399d368036aa0dd7be5eaa6beab3201ca783fcdeeca51ed72c094d3", "event_id": "E4", "agent": "emergency_management", "claim": "Using the non-authoritative unofficial English translation, the Authority is described as managing emergencies, crises and disasters through coordination and cooperation with relevant bodies, and coordinating the roles of relevant bodies when such events occur.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art5"], "evidence_status": "partially_supported"}, {"record": "0e88a2e6b399d368036aa0dd7be5eaa6beab3201ca783fcdeeca51ed72c094d3", "event_id": "E4", "agent": "emergency_management", "claim": "Using the non-authoritative unofficial English translation, the Authority is described as coordinating with print, audio and visual media to unify the media message during emergencies, crises or disasters.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art24"], "evidence_status": "partially_supported"}, {"record": "0e88a2e6b399d368036aa0dd7be5eaa6beab3201ca783fcdeeca51ed72c094d3", "event_id": "E4", "agent": "emergency_management", "claim": "Using the non-authoritative unofficial English translation, the Authority is described as establishing arrangements to provide information on situation developments and means of protecting the population, including information understandable to persons not proficient in Arabic and persons with special needs.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art25"], "evidence_status": "partially_supported"}, {"record": "0e88a2e6b399d368036aa0dd7be5eaa6beab3201ca783fcdeeca51ed72c094d3", "event_id": "E4", "agent": "emergency_management", "claim": "Using the non-authoritative unofficial English translation, all bodies are described as obliged to provide information requested by the Authority, and refusals by one body to provide information to another may be submitted to the Authority for necessary action.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art23"], "evidence_status": "partially_supported"}, {"record": "0e88a2e6b3 s Management Authority; the Arabic text prevails.", "cited_chunk_ids": ["ae-dl-8-2025-faacd:art4:p1"], "evidence_status": "confirmed"}, {"record": "adcefd842683d81eb48d0686341821e6aba2c99133e973bcc8abec41b700b2e9", "event_id": "E4", "agent": "policy_adviser", "claim": "The unofficial, non-authoritative English translation of Federal Decree-Law No. (2) of 2011 states that relevant bodies, each according to its competence, shall take measures including warning and guiding members of the community in coordination with the Authority, and that executive regulations determine the roles and responsibilities of relevant bodies.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art14"], "evidence_status": "partially_supported"}, {"record": "adcefd842683d81eb48d0686341821e6aba2c99133e973bcc8abec41b700b2e9", "event_id": "E4", "agent": "policy_adviser", "claim": "The unofficial, non-authoritative English translation of Federal Decree-Law No. (2) of 2011 states that operations centres shall be established in relevant bodies by decision of their competent authority and connected to the communications and electronic linkage network with the Authority.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art13"], "evidence_status": "partially_supported"}, {"record": "adcefd842683d81eb48d0686341821e6aba2c99133e973bcc8abec41b700b2e9", "event_id": "E4", "agent": "policy_adviser", "claim": "TDRA Public Telecommunication Licence No. (3) of 2026 provides that if a competent authority declares a public emergency, the licensee shall comply with directions given by TDRA or another competent authority, and shall comply with directions issued by TDRA or another competent authority on public interest, safety, and/or national security.", "cited_chunk_ids": ["ae-tdra-licence-3-2026:art8"], "evidence_status": "confirmed"}, {"record": "adcefd842683d81eb48d0686341821e6aba2c99133e973bcc8abec41b700b2e9", "event_id": "E4", "agent": "policy_adviser", "claim": "As a global technical comparison, ity for Ambulance and Civil Defense is the federal entity competent in ambulance and civil defense affairs, and includes among its competences establishing a public warning system for the population against potential hazards in coordination with the National Emergency, Crisis and Disasters Management Authority.", "cited_chunk_ids": ["ae-dl-8-2025-faacd:art4:p1"], "evidence_status": "confirmed"}, {"record": "7d1420835f49641e5905719113acb9cdf9f9d6a3d2b5fbd0611e617ffa8e7fb5", "event_id": "E4+followup", "agent": "policy_adviser", "claim": "The TDRA public telecommunications licence provides that, if a competent authority declares a public emergency, the licensee must comply with directions given by the TDRA or other competent authority regarding the licensee's property or its use or operation, and must comply with directions on public interest, safety, and national security.", "cited_chunk_ids": ["ae-tdra-licence-3-2026:art8"], "evidence_status": "confirmed"}, {"record": "7d1420835f49641e5905719113acb9cdf9f9d6a3d2b5fbd0611e617ffa8e7fb5", "event_id": "E4+followup", "agent": "policy_adviser", "claim": "As a global technical comparison, the CAP recommendation describes a false-alarm scenario in which officials, after determining an alert is inappropriate, issue a cancellation message referring directly to the erroneous prior alert; downstream systems then stop delivery, broadcast a cancellation, or reset.", "cited_chunk_ids": ["itu-x1303bis-cap:w018"], "evidence_status": "confirmed"}, {"record": "7d1420835f49641e5905719113acb9cdf9f9d6a3d2b5fbd0611e617ffa8e7fb5", "event_id": "E4+followup", "agent": "policy_adviser", "claim": "As a global comparison, the FCC Hawaii false-alert report recommended that false-alert correction procedures specify that corrections be issued over the same systems used for the false alert, including EAS and WEA, and also include media notification procedures.", "cited_chunk_ids": ["us-fcc-hawaii-2018:w066"], "evidence_status": "confirmed"}, {"record interest, safety, or national security matters.", "cited_chunk_ids": ["ae-tdra-licence-3-2026:art8"], "evidence_status": "confirmed"}, {"record": "20331f004e7c278df3f2b1d50c82828dc406efc6c3cd0402d5876e471c087617", "event_id": "E5+followup", "agent": "policy_adviser", "claim": "TDRA TS FS 001 describes UAE-Alert as a National Public Warning Service using cell broadcast technology to disseminate warning alerts issued by authorities to the public in times of crisis, and states that the specification’s main scope is enabling cell broadcast service in mobile devices operating on UAE mobile networks.", "cited_chunk_ids": ["ae-tdra-ts-fs-001:w002"], "evidence_status": "confirmed"}, {"record": "20331f004e7c278df3f2b1d50c82828dc406efc6c3cd0402d5876e471c087617", "event_id": "E5+followup", "agent": "policy_adviser", "claim": "TDRA TS FS 001 sets handset-side requirements including default receipt of emergency alerts, immediate recognisability, user cancellation of the message indication, later review, duplicate detection, Arabic and English display support, display without user interaction, and no handset capability to reply, forward, or copy received emergency alerts.", "cited_chunk_ids": ["ae-tdra-ts-fs-001:w003"], "evidence_status": "confirmed"}, {"record": "20331f004e7c278df3f2b1d50c82828dc406efc6c3cd0402d5876e471c087617", "event_id": "E5+followup", "agent": "policy_adviser", "claim": "In the non-authoritative English translation of Federal Decree-Law No. 2 of 2011, Article 14 says relevant bodies, each according to its competence, shall take necessary response and recovery measures in coordination with the Authority, including warning and guiding the community, and says the Executive Regulation determines the roles and responsibilities of relevant bodies for those measures.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art14"], "evidence_status": "partially_supported"}, {"record": "20331f004e7c278df3f2b1d50c82828dc406efc6c3cd0402d5876e471c087617", "event_id": "E5+followup", "agent": "policy_adviser", "claim": "In the non-authoritative English translation of Federal Decree-Law No. 2 of 2011, Article 13 says relevant bodies, each according to its competence, take prevention and preparedness measures in coordination with the Authority, including preparing response plans and establishing operations centres connected to the communications and electronic linkage network with the Authority.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art13"], "evidence_status": "partially_supported"}, {"record": "20331f004e7c278df3f2b1d50c82828dc406efc6c3cd0402d5876e471c087617", "event_id": "E5+followup", "agent": "policy_adviser", "claim": "As a global technical comparison, ITU-T CAP guidance describes a false-alarm scenario in which officials who determine an alert is inappropriate issue a cancellation message that refers directly to the erroneous prior alert; systems still delivering the alert stop, broadcast systems deliver a cancellation message, and other systems reset.", "cited_chunk_ids": ["itu-x1303bis-cap:w018"], "evidence_status": "confirmed"}, {"record": "20331f004e7c278df3f2b1d50c82828dc406efc6c3cd0402d5876e471c087617", "event_id": "E5+followup", "agent": "policy_adviser", "claim": "As a United States comparison, the FCC Hawaii false-alert report states that a cancellation instruction to downstream EAS and WEA equipment ceases retransmission, but does not generate a new alert transmission and does not recall messages already transmitted and displayed.", "cited_chunk_ids": ["us-fcc-hawaii-2018:w033"], "evidence_status": "confirmed"}, {"record": "20331f004e7c278df3f2b1d50c82828dc406efc6c3cd0402d5876e471c087617", "event_id": "E5+followup", "agent": "policy_adviser", "claim": "As a United States comparison, the FCC Hawaii false-alert report states that HI-EMA created EAS and WEA correction-message templates after the incident, and that before the incident HI-EMA did not have protocols or training for issuing a correction or handling a false alert.", "cited_chunk_ids": ["us-fcc-hawaii-2018:w062"], "evidence_status": "confirmed"}, {"record": "20331f004e7c278df3f2b1d50c82828dc406efc6c3cd0402d5876e471c087617", "event_id": "E5+followup", "agent": "policy_adviser", "claim": "As a United States comparison, the FCC Hawaii report recommended that state emergency-management agencies consult with State Emergency Communications Committees at least annually to ensure procedures, including initiation and cancellation of actual alerts and tests, are mutually understood, agreed upon, and documented in the State EAS Plan.", "cited_chunk_ids": ["us-fcc-hawaii-2018:w067"], "evidence_status": "confirmed"}, {"record": "6a6a5b1273569b43134be6362881c3efe2bb1bba557121b32507110cd56fdb56", "event_id": "E6", "agent": "emergency_management", "claim": "The unofficial, non-authoritative English translation of Article 5 states that the Authority manages emergencies, crises and disasters through coordination and cooperation with relevant bodies and coordinates the roles of relevant bodies when emergencies, crises or disasters occur.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art5"], "evidence_status": "partially_supported"}, {"record": "6a6a5b1273569b43134be6362881c3efe2bb1bba557121b32507110cd56fdb56", "event_id": "E6", "agent": "emergency_management", "claim": "The unofficial, non-authoritative English translation of Article 25 states that the Authority establishes arrangements to provide information on situation developments and means of protecting the population, including information understandable to persons not proficient in Arabic and persons with special needs.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art25"], "evidence_status": "partially_supported"}, {"record": "6a6a5b1273569b43134be6362881c3efe2bb1bba557121b32507110cd56fdb56", "event_id": "E6", "agent": "emergency_management", "claim": "The unofficial, non-authoritative English translation of Article 23 states that all bodies are thoritative English translation of Article 12 states that the Implementing Regulation determines the classification of emergency, crisis and disaster situations and the responsibilities and roles of relevant bodies according to the response plans.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art12"], "evidence_status": "partially_supported"}, {"record": "f8304672f068391f97a91b9c6ff7b4415963b0ee990fc7a666b23b5c9c2e68e7", "event_id": "E6", "agent": "policy_adviser", "claim": "The provided UAE Decree-Law passage is marked as an unofficial, non-authoritative English translation; it says relevant bodies, each according to its competence, take response and recovery measures in coordination with the Authority, including warning and guiding the community and dealing with the media according to strategies and policies approved by the Board of Directors, and that the Executive Regulation determines roles and responsibilities.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art14"], "evidence_status": "partially_supported"}, {"record": "f8304672f068391f97a91b9c6ff7b4415963b0ee990fc7a666b23b5c9c2e68e7", "event_id": "E6", "agent": "policy_adviser", "claim": "The provided UAE telecommunications licence passage says that, if a competent authority declares a public emergency, the licensee must comply with directions given by TDRA or another competent authority regarding the licensee's property or its use or operation; it also says the licensee must comply with directions on matters relating to public interest, safety and/or national security.", "cited_chunk_ids": ["ae-tdra-licence-3-2026:art8"], "evidence_status": "confirmed"}, {"record": "f8304672f068391f97a91b9c6ff7b4415963b0ee990fc7a666b23b5c9c2e68e7", "event_id": "E6", "agent": "policy_adviser", "claim": "As a global technical comparison, CAP 1.2 describes a false-alarm scenario in which, after officials determine an alert is inappropriate, officials issue a cancellation message referring directly to the erroneous prior alert, causing delivery systems to stop, broadcast systems to deliver a cancellation message, or other systems to reset.", "cited_chunk_ids": ["itu-x1303bis-cap:w018"], "evidence_status": "confirmed"}, {"record": "f8304672f068391f97a91b9c6ff7b4415963b0ee990fc7a666b23b5c9c2e68e7", "event_id": "E6", "agent": "policy_adviser", "claim": "As a global comparison from the Hawaii false-alert review, a cancellation message to downstream EAS and WEA equipment was described as an instruction to cease retransmission, not as a new alert transmission or an 'all clear' message, and not as a recall of messages already transmitted and displayed.", "cited_chunk_ids": ["us-fcc-hawaii-2018:w033"], "evidence_status": "confirmed"}, {"record": "f8304672f068391f97a91b9c6ff7b4415963b0ee990fc7a666b23b5c9c2e68e7", "event_id": "E6", "agent": "policy_adviser", "claim": "As a global comparison from the Hawaii false-alert review, after the false alert, templates for EAS and WEA messages to correct a false alarm were created because prior protocols or training on how to issue a correction or what to do after a false alert were not in place.", "cited_chunk_ids": ["us-fcc-hawaii-2018:w062"], "evidence_status": "confirmed"}, {"record": "239d1629d5da22f6b2d25f74866b1ca5ea1409fd5eccf563809e914a26fc72a9", "event_id": "E6+followup", "agent": "telecom_operator", "claim": "If a competent authority declares that a public emergency has arisen, the Licensee must comply with directions given by TDRA or another competent authority with respect to the Licensee's property or its use or operation.", "cited_chunk_ids": ["ae-tdra-licence-3-2026:art8"], "evidence_status": "confirmed"}, {"record": "239d1629d5da22f6b2d25f74866b1ca5ea1409fd5eccf563809e914a26fc72a9", "event_id": "E6+followup", "agent": "telecom_operator", "claim": "The Licensee must comply with directions issued by TDRA or another competent authority on matters relating to public interest, safety, and/or national security.", "cited_chunk_ids": ["ae-tdra-licence-3-2026:art8"], "evidence_status": "confirmed"}, {"record": "239d1629d5da22f6b2d25f74866b1ca5ea1409fd5eccf563809e914a26fc72a9", "event_id": "E6+followup", "agent": "telecom_operator", "claim": "UAE-Alert is a national public warning service using cell broadcast technology to disseminate warning alerts issued by authorities to the public in times of crisis, with UAE mobile networks identified as one channel.", "cited_chunk_ids": ["ae-tdra-ts-fs-001:w002"], "evidence_status": "confirmed"}, {"record": "239d1629d5da22f6b2d25f74866b1ca5ea1409fd5eccf563809e914a26fc72a9", "event_id": "E6+followup", "agent": "telecom_operator", "claim": "Cell Broadcast Service is defined as broadcasting messages to mobile phones of a large number of citizens in a specific location within a specific time frame, with the area ranging from one cell to the entire network.", "cited_chunk_ids": ["ae-tdra-ts-fs-001:w002"], "evidence_status": "confirmed"}, {"record": "239d1629d5da22f6b2d25f74866b1ca5ea1409fd5eccf563809e914a26fc72a9", "event_id": "E6+followup", "agent": "telecom_operator", "claim": "The Licensee must develop, maintain, and regularly enhance technical capabilities to ensure effective operation, management, and restoration of its Telecommunications Network under emergency and contingency conditions.", "cited_chunk_ids": ["ae-tdra-licence-3-2026:art12:p2"], "evidence_status": "confirmed"}, {"record": "239d1629d5da22f6b2d25f74866b1ca5ea1409fd5eccf563809e914a26fc72a9", "event_id": "E6+followup", "agent": "telecom_operator", "claim": "Cell broadcast must be enabled for GSM, UMTS, LTE, 5G, and future radio technologies under the cited UAE-Alert technical specification.", "cited_chunk_ids": ["ae-tdra-ts-fs-001:w004"], "evidence_status": "confirmed"}, {"record": "f7b631e5d8f4582e8b6d0ec4af2a47375241a2d1692d3c71702e40ff00cabdb1", "event_id": "E6+followup", "agent": "policy_adviser", "claim": "The unofficial, non-authoritative English translation of UAE Federal Decree-Law No. 2 of 2011 Article 14 states that relevant bodies, each according to its competence, take response and recovery measures in coordination with the Authority, including warning and guiding the community and dealing with the media according to clear strategies and policies approved by the Board of Directors; it also states that the Executive Regulation determines the roles and responsibilities of relevant bodies for those measures.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art14"], "evidence_status": "partially_supported"}, {"record": "f7b631e5d8f4582e8b6d0ec4af2a47375241a2d1692d3c71702e40ff00cabdb1", "event_id": "E6+followup", "agent": "policy_adviser", "claim": "The unofficial, non-authoritative English translation of UAE Federal Decree-Law No. 2 of 2011 Article 13 states that relevant bodies, each according to its competence, take prevention and preparedness measures in coordination with the Authority, including preparing response plans and training/exercise programmes, and establishing operations centres connected with the Authority’s communications and electronic linkage network.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art13"], "evidence_status": "partially_supported"}, {"record": "f7b631e5d8f4582e8b6d0ec4af2a47375241a2d1692d3c71702e40ff00cabdb1", "event_id": "E6+followup", "agent": "policy_adviser", "claim": "TDRA Public Telecommunication Licence No. 3 of 2026 Article 8 states that, where a competent authority declares a public emergency, the licensee must comply with directions given by TDRA or another competent authority concerning the licensee’s property or its use or operation; it also requires compliance with directions on matters relating to public interest, safety, and/or national security.", "cited_chunk_ids": ["ae-tdra-licence-3-2026:art8"], "evidence_status": "confirmed"}, {"record": "f7b631e5d8f4582e8b6d0ec4af2a47375241a2d1692d3c71702e40ff00cabdb1", "event_id": "E6+followup", "agent": "policy_adviser", "claim": "As a global technical comparison, ITU-T CAP 1.2 describes a false-alarm repudiation scenario in which officials, after determining an alert is inappropriate, issue a cancellation message referring directly to the erroneous prior alert; systems still delivering the alert stop, broadcast systems deliver a cancellation message, and other systems reset.", "cited_chunk_ids": ["itu-x1303bis-cap:w018"], "evidence_status": "confirmed"}, {"record": "f7b631e5d8f4582e8b6d0ec4af2a47375241a2d1692d3c71702e40ff00cabdb1", "event_id": "E6+followup", "agent": "policy_adviser", "claim": "As a global comparison, the FCC Hawaii false-alert report distinguishes a cancellation instruction to downstream EAS/WEA equipment from an all-clear or corrective public message, stating that cancellation does not generate a new alert transmission and does not recall messages already displayed.", "cited_chunk_ids": ["us-fcc-hawaii-2018:w033"], "evidence_status": "confirmed"}, {"record": "f7b631e5d8f4582e8b6d0ec4af2a47375241a2d1692d3c71702e40ff00cabdb1", "event_id": "E6+followup", "agent": "policy_adviser", "claim": "As a global comparison, the FCC Hawaii false-alert report states that HI-EMA later created EAS and WEA correction-message templates, and that before the false alert it did not have protocols or training for issuing a correction or responding to a false alert.", "cited_chunk_ids": ["us-fcc-hawaii-2018:w062"], "evidence_status": "confirmed"}, {"record": "0f9a1b3c86596bf8ba43e21d566d38a915ab56ccac82caa13bbe67c28eb7c0d7", "event_id": "E6+followup", "agent": "emergency_management", "claim": "The unofficial English translation of Article 5 says the Authority manages emergencies, crises and disasters through coordination and cooperation with relevant bodies and coordinates the roles of relevant bodies when such events occur.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art5"], "evidence_status": "partially_supported"}, {"record": "0f9a1b3c86596bf8ba43e21d566d38a915ab56ccac82caa13bbe67c28eb7c0d7", "event_id": "E6+followup", "agent": "emergency_management", "claim": "The unofficial English translation of Article 24 says the Authority coordinates with print, audio and visual media with the aim of unifying the media message during emergencies, crises or disasters.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art24"], "evidence_status": "partially_supported"}, {"record": "0f9a1b3c86596bf8ba43e21d566d38a915ab56ccac82caa13bbe67c28eb7c0d7", "event_id": "E6+followup", "agent": "emergency_management", "claim": "The unofficial English translation of Article 25 says the Authority establishes arrangements to provide information on developments in the situation and means of protecting the population, including information understandable to people not proficient in Arabic and persons with special needs.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art25"], "evidence_status": "partially_supported"}, {"record": "0f9a1b3c86596bf8ba43e21d566d38a915ab56ccac82caa13bbe67c28eb7c0d7", "event_id": "E6+followup", "agent": "emergency_management", "claim": "The unofficial English translation of Article 23 says all bodies must provide information requested by the Authority or its Board, and that refusals to provide information between bodies are submitted to the Authority for necessary action.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art23"], "evidence_status": "partially_supported"}, {"record": "0f9a1b3c86596bf8ba43e21d566d38a915ab56ccac82caa13bbe67c28eb7c0d7", "event_id": "E6+followup", "agent": "emergency_management", "claim": "The unofficial English translation of Article 26 says entities provide liaison personnel to the relevant operations centre for coordination, communication and providing necessary information.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art26"], "evidence_status": "partially_supported"}, {"record": "0f9a1b3c86596bf8ba43e21d566d38a915ab56ccac82caa13bbe67c28eb7c0d7", "event_id": "E6+followup", "agent": "emergency_management", "claim": "The official English translation of Article 4 of Federal Decree by Law No. 8 of 2025, with Arabic text prevailing, says the Federal Authority for Ambulance and Civil Defense is competent in ambulance and civil defense affairs and has competence to establish a public warning system for the population against potential hazards in coordination with the National Emergency, Crisis and Disasters Management Authority.", "cited_chunk_ids": ["ae-dl-8-2025-faacd:art4:p1"], "evidence_status": "confirmed"}, {"record": "0f9a1b3c86596bf8ba43e21d566d38a915ab56ccac82caa13bbe67c28eb7c0d7", "event_id": "E6+followup", "agent": "emergency_management", "claim": "The unofficial English translation of Article 15 says the National Security Adviser may issue directives determining the level of the emergency and activating emergency, crisis and disaster management teams at the local or national level whenever necessary.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art15"], "evidence_status": "partially_supported"}, {"record": "0f9a1b3c86596bf8ba43e21d566d38a915ab56ccac82caa13bbe67c28eb7c0d7", "event_id": "E6+followup", "agent": "emergency_management", "claim": "The unofficial English translation of Article 12 says the Implementing Regulation determines the classification of emergency, crisis and disaster situations and the responsibilities and roles of relevant bodies according to response plans.", "cited_chunk_ids": ["ae-dl-2-2011-ncema-en-unofficial:art12"], "evidence_status": "partially_supported"}, {"record": "0f9a1b3c86596bf8ba43e21d566d38a915ab56ccac82caa13bbe67c28eb7c0d7", "event_id": "E6+followup", "agent": "emergency_management", "claim": "The TDRA public telecommunications licence passage says a licensee must comply with directions issued by TDRA or another competent authority on matters relating to public interest, safety and/or national security.", "cited_chunk_ids": ["ae-tdra-licence-3-2026:art8"], "evidence_status": "confirmed"}], "dropped": <script>
const EXPORT = window.__EXPORT__ || null;
const LIVE = !EXPORT;   // true only when served by the local server (enables approve/reject buttons)
const ICON = {
  overview:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>',
  timeline:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h18"/><circle cx="7" cy="12" r="2.2"/><circle cx="14" cy="12" r="2.2"/></svg>',
  gaps:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h7v14H4zM13 5h7v14h-7z" stroke-dasharray="3 2"/></svg>',
  score:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>'
};
const TABS = [["overview","Overview","What is this test?"],["timeline","What happened","The six-event replay"],["gaps","What we found","Evidence-supported findings"],["score","Results & audit","AI with vs without documents"]];
// Gaps the report text presents as lower-confidence observations, not firm findings (see submission/technical_report, section h).
const LOWER_CONFIDENCE = ["G3","G5"];
// Readable labels for default views. Raw names stay visible in every "View details" drawer.
const FLAG_LABEL = { NO_MANDATE_FOUND:"No published authority located", PUBLIC_DOCUMENTATION_LIMITATION:"Source limitation", AMBIGUOUS_PROVISION:"Provision unclear",
  CONFLICT_DETECTED:"Provisions conflict", COORDINATION_REQUIRED:"Coordination needed", UNSUPPORTED:"Claim rewritten" };
const ACTION_LABEL = { request_information:"Request information", convene_coordination:"Convene coordination", report_network_status:"Report network status",
  flag_unclear_authority:"Flag unclear authority", flag_limitation:"Flag source limitation", request_operator_status:"Request operator status", provide_technical_facts:"Provide technical facts" };
// Guided "next step" at the end of each page (navigation only; uses the same data-tab switch as the header).
const NEXT = { overview:["timeline","Next: what happened"], timeline:["gaps","Next: what we found"], gaps:["score","Next: results & audit"], score:["overview","Back to the beginning"] };
const S = { tab:"overview", run:null, ev:null, report:null, runs:[], prevLeft:0, nextLeft:0, timer:null, fAgent:"all", fStatus:"all", tech:{} };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const human = s => String(s||"").replaceAll("_"," ");
const cap = s => { s = String(s||""); return s.charAt(0).toUpperCase() + s.slice(1); };
const flagLabel = f => FLAG_LABEL[f] || cap(human(String(f).toLowerCase()));
const actionLabel = a => ACTION_LABEL[a] || cap(human(a));
const firstSentence = t => { t = String(t||"").trim(); const m = t.match(/^.*?[.!?](?=\s|$)/); return m ? m[0] : t; };
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
// The soft curve of light behind each page's top panel (decoration only).
const WAVE = "M0,330 C260,320 330,448 600,448 C860,448 960,250 1200,140";
const bandArt = () => `<svg class="wave" viewBox="0 0 1200 600" preserveAspectRatio="none" aria-hidden="true" focusable="false">
  <defs><linearGradient id="wvFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="wv-a"/><stop offset="1" class="wv-b"/></linearGradient>
    <filter id="wvGlow" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="wvSoft" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="3"/></filter></defs>
  <path d="${WAVE} L1200,600 L0,600 Z" fill="url(#wvFill)"/>
  <path class="wv-back" d="M0,400 C300,380 430,520 720,520 C950,520 1060,430 1200,390"/>
  <path class="wv-glow" filter="url(#wvGlow)" d="${WAVE}"/><path class="wv-line2" filter="url(#wvSoft)" d="${WAVE}"/><path class="wv-line" d="${WAVE}"/></svg>`;
const band = (inner, hero) => `<section class="band${hero ? " hero" : ""}">${bandArt()}<div class="band-in">${inner}</div></section>`;
const IC = {
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.5"/></svg>'
};
const nextStep = k => `<nav class="nextstep" aria-label="Continue"><span>${k==="score" ? "You have reached the end of the story." : "Ready for the next step?"}</span><button class="btn primary" data-tab="${NEXT[k][0]}">${NEXT[k][1]} <span aria-hidden="true">→</span></button></nav>`;

async function api(path, opts) {
  if (EXPORT) {
    if (path === "/api/runs") return EXPORT.runs;
    if (path.startsWith("/api/run/")) return EXPORT.run;
    if (path === "/api/report") return EXPORT.report;
    if (path.startsWith("/api/chunk/")) return EXPORT.chunks[decodeURIComponent(path.slice(11))] || null;
    return null;
  }
  const r = await fetch(path, opts); return r.json();
}

function evClass(e){ return e==="confirmed" ? "ok" : e==="partially_supported" ? "part" : ""; }
function evLabel(e){ return (e||"").replace(/_/g," "); }
function evShort(e){ return e==="confirmed" ? "Verified" : e==="partially_supported" ? "Partly supported" : "Not established"; }
function vClass(v){ return v==="supported" ? "ok" : v==="partially_supported" ? "part" : "bad"; }
const passing = c => c.verifier_status==="supported" || c.verifier_status==="partially_supported";

function md(src){  // small markdown renderer (headings, quotes, lists, tables, bold, code, links)
  const lines = String(src).split("\n"); let out = "", list = 0, tbl = [];
  const inl = t => esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const close = () => { while (list > 0) { out += "</ul>"; list--; } };
  const flushT = () => { if (!tbl.length) return; const rows = tbl.filter(r => !/^\|[\s:|-]+\|$/.test(r)).map(r => r.split("|").slice(1,-1).map(c => c.trim()));
      out += '<div class="scroll"><table>' + rows.map((r,i) => "<tr>" + r.map(c => (i?"<td>":"<th>") + inl(c) + (i?"</td>":"</th>")).join("") + "</tr>").join("") + "</table></div>"; tbl = []; };
  for (const raw of lines) {
    const l = raw.replace(/\s+$/,"");
    if (/^\|.*\|$/.test(l)) { close(); tbl.push(l); continue; } else flushT();
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { close(); out += `<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`; }
    else if ((m = l.match(/^>\s?(.*)$/))) { close(); out += `<blockquote>${inl(m[1])}</blockquote>`; }
    else if ((m = l.match(/^(\s*)[-*]\s+(.*)$/))) { const depth = Math.floor(m[1].length/2)+1; while (list < depth) { out += "<ul>"; list++; } while (list > depth) { out += "</ul>"; list--; } out += `<li>${inl(m[2])}</li>`; }
    else if (/^---+$/.test(l)) { close(); out += "<hr>"; }
    else if (l.trim()==="") { close(); }
    else { if (list && /^\s{2,}/.test(raw)) out += `<div class="mute">${inl(l.trim())}</div>`; else { close(); out += `<p>${inl(l)}</p>`; } }
  }
  close(); flushT(); return out;
}

const citeChip = c => `<span class="chip cite" data-chunk="${esc(c)}" role="button" tabindex="0" title="Open the source citation">${esc(c)}</span>`;
const avatar = (agent, base) => { const a = String(agent).replace("baseline:",""); return `<div class="av ${base?"base":a}" aria-hidden="true">${esc(a[0].toUpperCase())}</div>`; };
const tech = (tab, inner) => `<details class="drawer-d tech" data-tech="${tab}" ${S.tech[tab]?"open":""}><summary>Technical evidence</summary><div class="in">${inner}</div></details>`;
const drawerBox = (title, inner, open) => `<details class="drawer-d"${open?" open":""}><summary>${title}</summary><div class="in">${inner}</div></details>`;

function apprState(r, run){ const a = run.approvals[r.hash]; return !r.human_approval.required ? "none" : a ? a.decision : "pending"; }
function apprChip(r, run){ const a = run.approvals[r.hash], s = apprState(r, run);
  return s==="none" ? `<span class="chip">No review needed</span>` : s==="pending" ? `<span class="chip part">Needs review</span>` : `<span class="chip ${s==="approved"?"green":"bad"}">${cap(s)} by ${esc(a.by)}</span>`; }

/* ---------- scorecard parsing (numbers come from report/scorecard.md, not retyped) ---------- */
function parseScore(){
  const rows = []; let inTable = false, seenHeader = false;
  for (const l of String(S.report.scorecard).split("\n")) {
    if (/^\|/.test(l)) { if (/^\|[\s:|-]+\|$/.test(l)) { inTable = true; continue; } if (!seenHeader) { seenHeader = true; continue; } if (inTable) rows.push(l.split("|").slice(1,-1).map(c=>c.trim())); }
    else if (inTable) break;
  }
  return rows.map(r => { const f = c => { const m = (c||"").match(/(\d+)\s*\/\s*(\d+)/); return m ? { a:+m[1], b:+m[2] } : null; }; return { metric:r[0], base:r[1], grd:r[2], bf:f(r[1]), gf:f(r[2]) }; });
}
const scoreFind = (rows, re) => rows.find(r => re.test(r.metric));
const leadInt = c => { const m = String(c||"").match(/^\s*(\d+)/); return m ? +m[1] : null; };

function claimsBlock(r){
  const cs = r.claims || []; if (!cs.length) return "";
  const ok = cs.filter(passing).length;
  return `<div class="sec">Claims and citations · ${cs.length} · ${ok} verified</div>` + cs.map(c => `<div class="claim-row ${vClass(c.verifier_status)}">
      <div class="t">${c.original_text ? `<span class="struck">${esc(c.original_text)}</span><br><b>${esc(c.text)}</b>` : esc(c.text)}</div>
      <div><span class="chip">${esc(c.claim_type||"")}</span><span class="chip ${evClass(c.evidence_status)}">${esc(evLabel(c.evidence_status))}</span><span class="chip ${vClass(c.verifier_status)}">verifier: ${esc(evLabel(c.verifier_status))}</span>
      ${(c.cited_chunk_ids||[]).map(citeChip).join("") || "<small>no citation</small>"}</div></div>`).join("");
}

function recordCard(r, run){
  const act = r.recommended_action || {};
  const req = r.human_approval.required, appr = run.approvals[r.hash];
  const buttons = (req && !appr && LIVE) ? `<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm go" data-dec="approved" data-hash="${r.hash}">Approve</button> <button class="btn sm no" data-dec="rejected" data-hash="${r.hash}">Reject</button></div>` : "";
  const flagsAll = r.flags || [], shown = flagsAll.slice(0,2);
  const flagChips = shown.map(f => `<span class="chip flag" title="${esc((run.flag_meaning||{})[f.flag]||"")}">${esc(flagLabel(f.flag))}</span>`).join("") + (flagsAll.length>2 ? `<span class="chip">+${flagsAll.length-2} more</span>` : "");
  const msgs = (r.messages_sent||[]).map(m => `<div style="margin:6px 0"><span class="chip">${esc(m.kind)}</span> to <b>${esc(human(m.to))}</b>: ${esc(m.content)}</div>`).join("");
  const rawFlags = flagsAll.map(f => `<div style="margin:4px 0"><span class="chip flag">${esc(f.flag)}</span> <small>${esc((run.flag_meaning||{})[f.flag]||"")} ${esc(f.why)}</small></div>`).join("");
  const inner = `<p>${esc(act.detail||"")}</p>
      ${act.human_authority_needed ? `<div class="human"><b>Human authority needed:</b> ${esc(act.human_authority_needed)}</div>` : ""}

}

function renderTimeline(run){
  const evs = run.scenario.events.slice().sort((a,b)=>a.t_offset-b.t_offset);

  const recs = run.grounded.filter(r => r.event_id === S.ev || r.event_id.startsWith(S.ev+"+"));
  const pend = recs.filter(r => r.human_approval.required && !run.approvals[r.hash]).length, reqd = recs.filter(r => r.human_approval.required).length;

  const next = recs.map(r => `<div class="nx"><b>${esc(human(r.agent))}</b>: ${esc(actionLabel((r.recommended_action||{}).action))}<small class="c2">${esc(firstSentence((r.recommended_action||{}).detail||r.reasoning_summary))}</small></div>`).join("");

  const inner = `<div class="sec">Full event text</div><p>${esc(full)}</p>

  S.nextLeft = left(ev);
  return `<div class="page">${band(`<span class="pill-o">Step 2 · fictional replay</span><h2 class="ptitle">What happened</h2>
    <p class="lead">Six fictional events, one at a time. Pick an event, or press Replay.</p>`)}

      <div class="stepbtns"><button class="btn sm" data-step="-1" ${idx===0?"disabled":""}>Previous</button><button class="btn sm" data-step="1" ${idx===evs.length-1?"disabled":""}>Next</button><button class="btn sm primary" data-play="1">${S.timer ? "Pause" : "Replay"}</button></div></div>
      <div class="track"><div class="line"></div><div class="done" style="width:${left(ev)}%"></div><div class="playhead" id="ph" style="left:${S.prevLeft}%"></div>${marks}</div></div>
    <div class="legend" aria-label="What the labels mean"><span><span class="chip ok">Verified</span> a published document supports it</span><span><span class="chip part">Partly supported</span> the documents back only part of it</span><span><span class="chip">Not established</span> the published documents do not say</span></div>
    <div class="panel evbig"><div class="q0">What happened</div><div class="what">${esc(first)}</div>
      <div class="qa">
        <div><div class="q">Who received it</div><div class="a"><div class="recv" style="margin:0">${recv}</div></div></div>
        <div><div class="q">Recommended next step</div><div class="a">${next || "No agent step for this event."}</div></div>
        <div><div class="q">Human review needed?</div><div class="a">${review}</div></div></div></div>
    ${tech("timeline", inner)}
    ${nextStep("timeline")}</div></div>`;
}

/* ---------- Evidence-supported findings ---------- */
function gapTitle(t){ return { decision_owner_unclear:"No event-specific decision owner identified", correction_procedure_not_established:"No correction or cancellation procedure established",
  interface_unclear:"Interface between bodies unclear", ambiguous_provision:"Provision can be read more than one way", mandate_not_established:"Mandate not established" }[t] || cap(human(t)); }

function gapCard(g, n, soft){
  const unofficial = (g.evidence||[]).some(e => String(e.chunk_id).includes("unofficial"));
  const sev = (g.severity||{}).level || "";
  const ev = (g.evidence||[]).map(e => `<div class="ev-item">${citeChip(e.chunk_id)}<div style="margin-top:6px">${esc(e.why)}</div></div>`).join("");
  const gc = g.global_comparison ? `<div class="sec">Global comparison</div><div class="ev-item">${citeChip(g.global_comparison.chunk_id)}<div style="margin-top:6px">${esc(g.global_comparison.why || g.global_comparison.summary || "")}</div></div>` : "";
  const inner = `<p><small>${soft ? "Observation" : "Finding"} ${n} · listed as <code>${esc(g.gap_id)}</code> in the report · type <code>${esc(g.type)}</code></small></p>
    <div class="kv"><div class="k">Affected roles</div><div>${(g.affected_institutions||[]).map(a=>`<span class="chip">${esc(human(a))}</span>`).join("")}</div>
      <div class="k">Direction (domain level)</div><div>${esc(g.direction||"")}</div></div>
    <div class="sec">What the sources give, and what they do not</div>${ev}${gc}
    <div class="sec">Verification note and traceability</div><p class="mute">${esc(g.verifier_notes||"")}</p><small>Traceable to ${(g.source_records||[]).length} audit records.</small>`;
  return `<div class="panel gap ${soft?"obs":sev}"><span class="sevbar" aria-hidden="true"></span>
    <div>${soft ? `<span class="chip">Lower-confidence observation</span>` : `<span class="chip sev-${esc(sev)} lg">${cap(esc(sev))} severity</span>`}
      <span class="chip ${unofficial?"part":"ok"}">${unofficial ? "Partly supported · unofficial translation" : "Evidence checked"}</span></div>
    <h3>${esc(gapTitle(g.type))}</h3>
    <div class="lbl">Why it matters</div><div class="txt">${esc((g.severity||{}).rationale||"")}</div>
    <div class="lbl">What the documents do not say</div><div class="txt c3">${esc(g.description)}</div>
    ${drawerBox("View evidence", inner)}</div>`;
}

function renderGaps(){
  const ga = S.report.gap_analysis || {gaps:[], documentation_limitations:[]};
  const firm = ga.gaps.filter(g => !LOWER_CONFIDENCE.includes(g.gap_id)), soft = ga.gaps.filter(g => LOWER_CONFIDENCE.includes(g.gap_id));
  const lims = ga.documentation_limitations || [];
  const seen = new Set(), uniq = lims.filter(l => { const k = (l.why||l).slice(0,90); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0,8);
  const inner = `<div class="note">Gaps describe what the <b>published documents</b> establish, not how any institution behaves. Each depends on a corpus that does not include the NCEMA Executive Regulation, and NCEMA citations rest on an unofficial English translation: check them against the Arabic original.</div>
    ${soft.length ? `<div class="sec">Lower-confidence observations (${soft.length})</div>${soft.map((g,i) => gapCard(g, i+1, true)).join("")}` : ""}
    <div class="sec">Source limitation (not a finding)</div>
    <div class="limit"><h3>Source limitation</h3><div class="mute">Things the public corpus does not establish, such as detail delegated to an Executive Regulation that is not in the knowledge base. They describe what could be checked, not the policy.</div>
      <ul style="margin:10px 0 0;padding-left:20px">${uniq.map(l => `<li>${esc(l.why||l)} <small>(${esc(l.event_id||"")}, ${esc(human(l.agent||""))})</small></li>`).join("")}</ul><small>${lims.length} raised, ${uniq.length} distinct shown.</small></div>
    <div class="sec">Full gap report</div><div class="md">${md(S.report.gap_report)}</div>`;
  return `<div class="page">${band(`<span class="pill-o">Step 3 · published documents only</span><h2 class="ptitle">What we found</h2>
    <p class="lead">${firm.length} evidence-supported findings. Each one is something the published documents do not say. They describe the documents, not how any institution behaves.</p>`)}
    <div class="content">
    ${firm.map((g,i) => gapCard(g, i+1, false)).join("")}
    ${tech("gaps", inner)}
    ${nextStep("gaps")}</div></div>`;
}

/* ---------- Scorecard ---------- */
function renderScore(){
  const rows = parseScore(), run = S.run, ck = run.chain, ok = ck.grounded.ok && ck.baseline.ok;
  const rV = scoreFind(rows, /^Citation validity, strict/i), rU = scoreFind(rows, /^Unsupported mandate claims/i), rG = scoreFind(rows, /^Verifiable gaps/i);
  const pct = f => f && f.b ? Math.round(100*f.a/f.b) : 0;
  const bar = (f, cls) => `<div class="bar ${cls}"><i style="width:${pct(f)}%"></i></div>`;
  const core = rV && rV.bf && rV.gf ? `<div class="panel core"><div class="vs">
      <div class="g"><div class="who">AI with documents</div><div class="big">${rV.gf.a}/${rV.gf.b}</div>${bar(rV.gf,"grd")}<small>verified</small></div>
      <div class="b"><div class="who">AI without documents</div><div class="big">${rV.bf.a}/${rV.bf.b}</div>${bar(rV.bf,"base")}<small>verified</small></div></div>
      <p class="small" style="margin:16px 0 0">One run each. No statistical significance is claimed.</p></div>` : "";
  const m = (title, a, b) => `<div class="metric panel"><div class="mt">${title}</div><div class="vs"><div class="b"><div class="who">Plain LLM</div><div class="big">${a}</div></div><div class="g"><div class="who">KB-grounded</div><div class="big">${b}</div></div></div></div>`;
  const softN = ((S.report.gap_analysis||{}).gaps||[]).filter(x => LOWER_CONFIDENCE.includes(x.gap_id)).length;
  const metrics = `<div class="metrics">${rU ? m("Unsupported mandate claims left in the output", esc(leadInt(rU.base)), esc(leadInt(rU.grd))) : ""}${rG ? m(`Evidence-supported findings (grounded count includes ${softN} lower-confidence observations)`, esc(leadInt(rG.base)), esc(leadInt(rG.grd))) : ""}</div>`;
  const body = rows.map(r => `<tr><td class="m">${esc(r.metric)}</td><td>${esc(r.base)}</td><td>${esc(r.grd)}</td></tr>`).join("");
  const inner = `<div class="sec">How this was measured</div><div class="note">Same scenario, same roles, same inbox visibility, same verifier against the same KB. <b>One run per condition</b>; the same model family writes and verifies, so the human spot check (<code>report/spot_check.csv</code>) is the independent check. No significance is claimed.</div>
      ${metrics}<div class="scroll"><table class="cmp"><tr><th>Metric</th><th>Plain LLM (no KB)</th><th>KB-grounded</th></tr>${body}</table></div>
      <div class="sec">Full scorecard (buckets, topics, spot check)</div><div class="md">${md(S.report.scorecard)}</div>
      <div class="sec">Audit log</div>${auditInner(run)}
      <div class="sec">Plain AI answers (no knowledge base)</div>${baselineInner(run)}`;
  return `<div class="page">${band(`<span class="pill-o">Step 4 · same scenario, same verifier</span><h2 class="ptitle">Results &amp; audit</h2>
    <div class="headline"><em>AI with documents</em> produced more verifiable claims</div>
    <p class="lead">The same scenario was run twice: once with the published documents, once without them. Both were checked the same way.</p>`)}
    <div class="content">
    ${core}
    <div class="panel integrity"><span class="tag ${ok?"ok":"bad"}"><span class="dotp"></span>${ok ? "Audit chain intact" : "Audit chain BROKEN"}</span><small>Every step is recorded and linked to the previous one. Edits would break the chain.</small></div>
    ${tech("score", inner)}
    ${nextStep("score")}</div></div>`;
}

/* ---------- Audit chain: filterable activity feed ---------- */
function auditInner(run){
  const ck = run.chain, ok = ck.grounded.ok && ck.baseline.ok;
  const agents = [...new Set(run.grounded.map(r => r.agent))];
  const stat = r => apprState(r, run);
  const list = run.grounded.filter(r => (S.fAgent==="all" || r.agent===S.fAgent) && (S.fStatus==="all" || stat(r)===S.fStatus));
  const fb = (grp, v, label, count) => `<button class="fbtn ${S[grp]===v?"on":""}" data-f="${grp}:${v}" aria-pressed="${S[grp]===v}">${esc(label)}${count!=null?` · ${count}`:""}</button>`;
  const cnt = s => run.grounded.filter(r => stat(r)===s).length;
  const items = list.map(r => { const act = r.recommended_action || {}, s = stat(r);
    const inner = `<div class="kv"><div class="k">Record hash</div><div><code>${esc(r.hash)}</code></div><div class="k">Previous hash</div><div><code>${esc(r.prev_hash)}</code></div>
        <div class="k">Event id</div><div>${esc(r.event_id)}</div><div class="k">Action</div><div><code>${esc(act.action)}</code></div>
        <div class="k">Evidence label</div><div>${esc(evLabel(r.evidence_status))}</div><div class="k">Flags (raw)</div><div>${(r.flags||[]).map(f=>`<span class="chip flag" title="${esc(f.why)}">${esc(f.flag)}</span>`).join("") || "none"}</div>
        <div class="k">Models</div><div>${esc(r.model)} · verifier ${esc(r.verifier_model||"")} · KB ${esc(r.kb_version)}</div></div><pre>${esc(JSON.stringify(r, null, 1))}</pre>`;
    return `<div class="panel fi ${s==="pending"?"pend":""}"><div class="row"><b>${esc(human(r.agent))} <small style="text-transform:none">· Event ${esc(r.event_id.replace("+followup"," follow-up"))}</small></b><span>${apprChip(r, run)}</span></div>
      <div class="act">${esc(actionLabel(act.action))}</div><div><span class="chip ${evClass(r.evidence_status)}">${esc(evShort(r.evidence_status))}</span><small> · ${new Date(r.ts*1000).toLocaleTimeString()} · hash ${esc(r.hash.slice(0,8))}</small></div>
      ${drawerBox("Audit detail", inner)}</div>`; }).join("");
  return `<div class="panel integrity"><span class="tag ${ok?"ok":"bad"}"><span class="dotp"></span>${ok ? "Chain intact" : "Chain BROKEN"}</span><small>grounded log: ${esc(ck.grounded.message)} · baseline log: ${esc(ck.baseline.message)}</small></div>
    <div class="filters"><span class="lbl">Agent</span>${fb("fAgent","all","All")}${agents.map(a => fb("fAgent", a, human(a))).join("")}</div>
    <div class="filters"><span class="lbl">Review</span>${fb("fStatus","all","All")}${fb("fStatus","pending","Needs review",cnt("pending"))}${fb("fStatus","approved","Approved",cnt("approved"))}${fb("fStatus","rejected","Rejected",cnt("rejected"))}</div>
    <div class="feed">${items || `<div class="panel mute">No records match these filters.</div>`}</div>`;
}

/* ---------- Baseline ---------- */
function baselineInner(run){
  const cards = run.baseline.map(r => `<div class="panel rec"><div class="hd"><div class="who">${avatar(r.agent,true)}<div><b>${esc(human(r.agent.replace("baseline:","")))}</b><small>plain LLM · Event ${esc(r.event_id)}</small></div></div><span class="chip">No sources checked</span></div>
    <p class="sum c3" style="margin-top:12px">${esc(r.reasoning_summary)}</p>
    ${(r.claims||[]).length ? drawerBox(`View details · ${r.claims.length} claims and the citations given`, r.claims.map(c=>`<div class="claim-row"><div class="t">${esc(c.text)}</div><div><span class="chip">${esc(c.claim_type)}</span> <small>citation (free text, unverified): ${esc(c.citation_text||"none")}</small></div></div>`).join("")) : "<small>No parseable claims.</small>"}</div>`).join("");
  return `<div class="note">Same roles and event visibility, no knowledge base. Its claims are scored by the same verifier against the KB (see Results).</div><div class="grid2">${cards}</div>`;
}

async function draw(){
  const run = S.run;
  $("chain").innerHTML = run ? `<span class="tag ${run.chain.grounded.ok&&run.chain.baseline.ok?"ok":"bad"}"><span class="dotp"></span>audit chain ${run.chain.grounded.ok&&run.chain.baseline.ok?"intact":"BROKEN"}</span>` : "";
  $("tabs").innerHTML = TABS.map(([k,l,sub],i) => `<button class="navbtn ${k===S.tab?"on":""}" data-tab="${k}" title="${sub}"${k===S.tab?' aria-current="page"':""}><span class="num">${i+1}</span><span><b>${l}</b><small>${sub}</small></span></button>`).join("");
  let h = "";
  if (!run) h = `<div class="panel">No run found. Run <code>python scripts/run_scenario.py</code> first.</div>`;
  else if (S.tab==="overview") h = renderOverview(run);
  else if (S.tab==="timeline") h = renderTimeline(run);
  else if (S.tab==="gaps") h = renderGaps();
  else if (S.tab==="score") h = renderScore();
  $("view").innerHTML = h;
  const on = document.querySelector(".navbtn.on"); if (on && on.scrollIntoView && $("tabs").scrollWidth > $("tabs").clientWidth) on.scrollIntoView({block:"nearest", inline:"center"});
  if (S.tab==="timeline" && $("ph")) { const ph = $("ph"); requestAnimationFrame(() => requestAnimationFrame(() => { ph.style.left = S.nextLeft + "%"; })); S.prevLeft = S.nextLeft; }
}

async function openChunk(id){
  const d = $("drawer"); d.classList.add("open"); d.innerHTML = "<small>Loading…</small>";
  const c = await api("/api/chunk/" + encodeURIComponent(id));
  const closeBtn = `<button class="btn sm" id="x">Close</button>`;
  if (!c || c.error) { d.innerHTML = `${closeBtn}<p style="margin-top:18px">Source not available here: <code>${esc(id)}</code></p>`; $("x").onclick = () => d.classList.remove("open"); return; }
  d.innerHTML = `${closeBtn}<div class="eyebrow">Evidence drawer</div><h3 style="margin:8px 0">${esc(c.article)}</h3><p class="mute">${esc(c.citation)}</p>
    <p><span class="chip">${esc(c.authority_status)}</span><span class="chip ${c.translation_status==="unofficial_translation"?"part":""}">${esc(c.translation_status)}</span></p>
    ${c.url ? `<p><a class="btn" href="${esc(c.url)}" target="_blank" rel="noopener">Open the official source <span aria-hidden="true">↗</span></a></p>` : ""}
    ${c.excerpt ? `<p class="mute"><small>Excerpt shown locally only; the source URL above is authoritative.</small></p><pre style="white-space:pre-wrap">${esc(c.excerpt)}</pre>` : `<p class="mute"><small>Passage text is not included in the shared export (publishers reserve rights); open the source URL.</small></p>`}`;
  $("x").onclick = () => d.classList.remove("open"); $("x").focus();
}

function stopPlay(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } }
function evList(){ return S.run.scenario.events.slice().sort((a,b)=>a.t_offset-b.t_offset); }
function startPlay(){
  const evs = evList(); S.ev = evs[0].event_id; S.prevLeft = 0; S.tech.timeline = false; draw();   // drawers stay closed while replaying
  S.timer = setInterval(() => { const i = evs.findIndex(e => e.event_id===S.ev); if (i >= evs.length-1) { stopPlay(); draw(); return; } S.ev = evs[i+1].event_id; draw(); }, 3600);
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-ev],[data-chunk],[data-dec],[data-play],[data-step],[data-f]") || e.target;
  if (t.dataset.tab) { stopPlay(); S.tab = t.dataset.tab; window.scrollTo({top:0}); return draw(); }
  if (t.dataset.play) { return S.timer ? (stopPlay(), draw()) : startPlay(); }
  if (t.dataset.step) { stopPlay(); const evs = evList(), i = evs.findIndex(x => x.event_id===S.ev); const j = Math.min(evs.length-1, Math.max(0, i + (+t.dataset.step))); S.ev = evs[j].event_id; return draw(); }
  if (t.dataset.ev) { stopPlay(); S.ev = t.dataset.ev; return draw(); }
  if (t.dataset.f) { const [k, v] = t.dataset.f.split(":"); S[k] = v; return draw(); }
  if (t.dataset.chunk) return openChunk(t.dataset.chunk);
  if (t.dataset.dec) {
    let by = $("who").value.trim();
    if (!by) { by = (prompt("Type your name to continue. Only a named human can approve or reject.") || "").trim(); if (!by) return; $("who").value = by; }
    const note = prompt("Optional note for the record:") || "";
    const r = await api("/api/approve", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ run_id:S.run.run_id, hash:t.dataset.hash, decision:t.dataset.dec, by, note }) });
    if (r.error) { alert(r.error); return; }
    await load(S.run.run_id);
  }
});
document.addEventListener("toggle", e => { const t = e.target; if (t.dataset && t.dataset.tech) S.tech[t.dataset.tech] = t.open; }, true);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("drawer").classList.remove("open");
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.chunk) { e.preventDefault(); openChunk(e.target.dataset.chunk); }
});

async function load(id){ S.run = await api("/api/run/" + id); draw(); }

/* header turns into a floating frosted bar once the page scrolls (presentation only) */
addEventListener("scroll", () => { const h = $("hdr"); if (h) h.classList.toggle("solid", scrollY > 24); }, { passive:true });

/* ---------- a few slow, faint drifting specks (decoration only; hidden when reduced motion is requested) ---------- */
(function particles(){
  const c = $("fx"), x = c && c.getContext && c.getContext("2d"); if (!x) return;
  let w, h, P = [], rgb = "201,138,46";
  const size = () => { w = c.width = innerWidth; h = c.height = innerHeight; rgb = (getComputedStyle(document.documentElement).getPropertyValue("--particle") || rgb).trim() || rgb;
    P = Array.from({length: Math.min(34, Math.round(w*h/42000))}, () => ({ x:Math.random()*w, y:Math.random()*h, r:Math.random()*2+.6, vx:(Math.random()-.5)*.1, vy:(Math.random()-.5)*.1, a:Math.random()*.3+.12 })); };
  const frame = () => { x.clearRect(0,0,w,h); for (const p of P) { if (!REDUCED) { p.x+=p.vx; p.y+=p.vy; if (p.x<0) p.x=w; if (p.x>w) p.x=0; if (p.y<0) p.y=h; if (p.y>h) p.y=0; }
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.283); x.fillStyle = `rgba(${rgb},${p.a})`; x.fill(); }
    if (!REDUCED && !document.hidden) requestAnimationFrame(frame); else if (!REDUCED) setTimeout(()=>requestAnimationFrame(frame),500); };
  size(); addEventListener("resize", size); frame();
})();

(async function init(){
  $("mode").textContent = EXPORT ? "read-only export" : "local viewer";
  if (EXPORT) { $("whoLbl").style.display = "none"; }
  S.runs = await api("/api/runs"); S.report = await api("/api/report");
  $("runSel").innerHTML = S.runs.map(r => `<option>${esc(r)}</option>`).join("");
  $("runSel").onchange = ev => { S.ev = null; stopPlay(); load(ev.target.value); };
  if (S.runs.length) await load(S.runs[0]); else draw();
})();
</script>
</body>
